<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octevent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared.js"></script>
<script src="/header.js"></script>
</head>
<body>
<div id="app-header"></div>
<main>
<div class="panel-header">
  <div class="panel-header-left">
    <div class="panel-title">Checklist</div>
    <button class="btn" id="cl-hide-btn" onclick="toggleHide()">Show completed</button>
    <button class="btn" onclick="openTplModal()">Template</button>
    <button class="btn danger" id="cl-reset-btn" onclick="resetAll()" style="display:none;">Reset all</button>
  </div>
  <button class="btn amber" onclick="addTask()">+ Add task</button>
</div>
<div class="progress-wrap" id="cl-progress" style="display:none;">
  <div class="progress-label"><span id="cl-prog-text"></span><span id="cl-prog-pct"></span></div>
  <div class="progress-bar"><div class="progress-fill" id="cl-prog-fill"></div></div>
</div>
<div id="cl-content"><div class="spinner"></div></div>
</main>
<div class="modal-overlay" id="tpl-modal" onclick="if(event.target===this)closeTplModal()">
  <div class="modal" style="max-width:440px;">
    <div class="modal-header"><div class="modal-title">Choose a template</div><button class="modal-close" onclick="closeTplModal()">&#x2715;</button></div>
    <p style="font-size:0.81rem;color:var(--ink3);margin-bottom:1rem;">Tasks will be added to your existing checklist.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;">
      <div onclick="loadTemplate('wedding')" style="border:1.5px solid var(--rule);border-radius:11px;padding:1rem;cursor:pointer;text-align:center;" onmouseover="this.style.borderColor='var(--amber)';this.style.background='var(--amber-light)'" onmouseout="this.style.borderColor='var(--rule)';this.style.background=''"><div style="font-size:1.3rem;margin-bottom:0.3rem;">&#x1F48D;</div><div style="font-weight:700;">Wedding</div><div style="font-size:0.72rem;color:var(--ink3);">18 tasks</div></div>
      <div onclick="loadTemplate('corporate')" style="border:1.5px solid var(--rule);border-radius:11px;padding:1rem;cursor:pointer;text-align:center;" onmouseover="this.style.borderColor='var(--amber)';this.style.background='var(--amber-light)'" onmouseout="this.style.borderColor='var(--rule)';this.style.background=''"><div style="font-size:1.3rem;margin-bottom:0.3rem;">&#x1F4BC;</div><div style="font-weight:700;">Corporate</div><div style="font-size:0.72rem;color:var(--ink3);">13 tasks</div></div>
      <div onclick="loadTemplate('private_party')" style="border:1.5px solid var(--rule);border-radius:11px;padding:1rem;cursor:pointer;text-align:center;" onmouseover="this.style.borderColor='var(--amber)';this.style.background='var(--amber-light)'" onmouseout="this.style.borderColor='var(--rule)';this.style.background=''"><div style="font-size:1.3rem;margin-bottom:0.3rem;">&#x1F389;</div><div style="font-weight:700;">Private party</div><div style="font-size:0.72rem;color:var(--ink3);">10 tasks</div></div>
      <div onclick="loadTemplate('retreat')" style="border:1.5px solid var(--rule);border-radius:11px;padding:1rem;cursor:pointer;text-align:center;" onmouseover="this.style.borderColor='var(--amber)';this.style.background='var(--amber-light)'" onmouseout="this.style.borderColor='var(--rule)';this.style.background=''"><div style="font-size:1.3rem;margin-bottom:0.3rem;">&#x1F33F;</div><div style="font-weight:700;">Retreat</div><div style="font-size:0.72rem;color:var(--ink3);">9 tasks</div></div>
      <div onclick="loadTemplate('group_holiday')" style="border:1.5px solid var(--rule);border-radius:11px;padding:1rem;cursor:pointer;text-align:center;" onmouseover="this.style.borderColor='var(--amber)';this.style.background='var(--amber-light)'" onmouseout="this.style.borderColor='var(--rule)';this.style.background=''"><div style="font-size:1.3rem;margin-bottom:0.3rem;">&#x2708;&#xFE0F;</div><div style="font-weight:700;">Group holiday</div><div style="font-size:0.72rem;color:var(--ink3);">8 tasks</div></div>
      <div onclick="addTask();closeTplModal()" style="border:1.5px solid var(--rule);border-radius:11px;padding:1rem;cursor:pointer;text-align:center;" onmouseover="this.style.borderColor='var(--amber)';this.style.background='var(--amber-light)'" onmouseout="this.style.borderColor='var(--rule)';this.style.background=''"><div style="font-size:1.3rem;margin-bottom:0.3rem;">&#x270F;&#xFE0F;</div><div style="font-weight:700;">From scratch</div><div style="font-size:0.72rem;color:var(--ink3);">Build your own</div></div>
    </div>
    <div style="text-align:center;margin-top:1rem;"><button class="btn-cancel" onclick="closeTplModal()">Cancel</button></div>
  </div>
</div>
<script>

var allItems=[], hideDone=true;
var STAGE_ORDER=['planning','booking','confirmed','on_the_day','post_event'];
var STAGE_LABELS={planning:'Planning',booking:'Booking',confirmed:'Confirmed',on_the_day:'On the day',post_event:'Post event'};
var STATUS_LABELS={not_started:'Not started',in_progress:'In progress',done:'Done',blocked:'Blocked'};
var STAGE_STYLES={planning:'background:#e8f0fd;color:#1a3fa8;',booking:'background:#fdf6ec;color:#92600a;',confirmed:'background:#f0f7f4;color:var(--green);',on_the_day:'background:var(--amber-light);color:var(--amber-dark);',post_event:'background:var(--rule);color:var(--ink3);'};
var STATUS_STYLES={not_started:'background:var(--rule);color:var(--ink3);',in_progress:'background:#e8f0fd;color:#1a3fa8;',done:'background:#f0f7f4;color:var(--green);',blocked:'background:#fdf0f0;color:var(--red);'};
var TEMPLATES={
  wedding:[{stage:'planning',category:'Budget',task:'Set overall wedding budget'},{stage:'planning',category:'Venue',task:'Research and visit wedding venues'},{stage:'planning',category:'Venue',task:'Book ceremony and reception venue'},{stage:'planning',category:'Guests',task:'Draft initial guest list'},{stage:'booking',category:'Catering',task:'Book wedding caterer'},{stage:'booking',category:'Music',task:'Book band or DJ'},{stage:'booking',category:'Photography',task:'Book photographer'},{stage:'booking',category:'Flowers',task:'Book florist'},{stage:'booking',category:'Guests',task:'Send formal invitations'},{stage:'confirmed',category:'Guests',task:'Chase outstanding RSVPs'},{stage:'confirmed',category:'Guests',task:'Collect dietary requirements'},{stage:'confirmed',category:'Venue',task:'Final venue walkthrough'},{stage:'confirmed',category:'Seating',task:'Create seating plan'},{stage:'confirmed',category:'General',task:'Create detailed run sheet'},{stage:'on_the_day',category:'Venue',task:'Oversee venue and decor setup'},{stage:'on_the_day',category:'General',task:'Welcome guests'},{stage:'post_event',category:'Finance',task:'Settle all outstanding invoices'},{stage:'post_event',category:'Guests',task:'Send thank you cards'}],
  corporate:[{stage:'planning',category:'Budget',task:'Set event budget and get approval'},{stage:'planning',category:'Venue',task:'Book venue and sign contract'},{stage:'planning',category:'Speakers',task:'Identify and invite keynote speakers'},{stage:'booking',category:'Catering',task:'Book catering supplier'},{stage:'booking',category:'AV',task:'Book AV company and equipment'},{stage:'booking',category:'Marketing',task:'Launch event registration'},{stage:'confirmed',category:'Attendees',task:'Send joining instructions'},{stage:'confirmed',category:'Speakers',task:'Send final briefing to speakers'},{stage:'confirmed',category:'Venue',task:'Final venue walkthrough'},{stage:'on_the_day',category:'Venue',task:'Oversee venue setup and branding'},{stage:'on_the_day',category:'Speakers',task:'Welcome and brief speakers'},{stage:'post_event',category:'Finance',task:'Settle all supplier invoices'},{stage:'post_event',category:'General',task:'Review against KPIs and write report'}],
  private_party:[{stage:'planning',category:'Budget',task:'Set overall event budget'},{stage:'planning',category:'Venue',task:'Confirm venue and sign contract'},{stage:'booking',category:'Guests',task:'Send invitations'},{stage:'booking',category:'Catering',task:'Book catering supplier'},{stage:'booking',category:'Entertainment',task:'Book DJ or entertainment'},{stage:'confirmed',category:'Guests',task:'Chase outstanding RSVPs'},{stage:'confirmed',category:'Catering',task:'Confirm final numbers with caterer'},{stage:'confirmed',category:'General',task:'Create run sheet for the day'},{stage:'on_the_day',category:'Venue',task:'Oversee venue setup'},{stage:'post_event',category:'Finance',task:'Settle final invoices'}],
  retreat:[{stage:'planning',category:'Budget',task:'Set retreat budget'},{stage:'planning',category:'Venue',task:'Book venue and accommodation'},{stage:'planning',category:'Programme',task:'Design retreat programme and schedule'},{stage:'booking',category:'Facilitators',task:'Book facilitators and coaches'},{stage:'booking',category:'Activities',task:'Book activities and excursions'},{stage:'confirmed',category:'Guests',task:'Send pre-retreat information pack'},{stage:'confirmed',category:'Programme',task:'Finalise daily schedule'},{stage:'on_the_day',category:'Guests',task:'Welcome guests and room allocation'},{stage:'post_event',category:'General',task:'Gather feedback from participants'}],
  group_holiday:[{stage:'planning',category:'Budget',task:'Set group budget and agree cost sharing'},{stage:'planning',category:'Accommodation',task:'Book accommodation'},{stage:'booking',category:'Travel',task:'Book group flights or transport'},{stage:'booking',category:'Activities',task:'Book group activities'},{stage:'confirmed',category:'Guests',task:'Share travel details with all guests'},{stage:'confirmed',category:'General',task:'Share final itinerary with group'},{stage:'on_the_day',category:'Travel',task:'Coordinate group travel and check-in'},{stage:'post_event',category:'Finance',task:'Settle any outstanding shared costs'}]
};

async function init(){
  await OctHeader.init('checklist');
  var res=await sb.from('checklist_items').select('*').eq('event_id',eventId).order('created_at',{ascending:true});
  allItems=res.data||[];
  render();
}

function buildRow(item){
  var tr=document.createElement('tr');
  if(item.status==='done') tr.style.opacity='0.5';
  tr.innerHTML='<td><span class="badge" style="'+STAGE_STYLES[item.stage||'planning']+'">'+STAGE_LABELS[item.stage||'planning']+'</span></td>'
    +'<td style="font-size:0.78rem;color:var(--ink3);">'+(item.category||'—')+'</td>'
    +'<td style="'+(item.status==='done'?'text-decoration:line-through;':'')+'font-weight:500;">'+(item.task||'—')+'</td>'
    +'<td style="text-align:center;"><div data-id="'+item.id+'" data-status="'+item.status+'" class="cl-check" style="width:18px;height:18px;border-radius:4px;border:2px solid '+(item.status==='done'?'var(--amber)':'var(--rule)')+';background:'+(item.status==='done'?'var(--amber)':'#fff')+';cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:11px;font-weight:700;">'+(item.status==='done'?'&#x2713;':'')+'</div></td>'
    +'<td><span class="badge" style="'+STATUS_STYLES[item.status||'not_started']+'">'+STATUS_LABELS[item.status||'not_started']+'</span></td>'
    +'<td style="font-size:0.78rem;">'+(item.who||'—')+'</td>'
    +'<td style="font-size:0.78rem;">'+fmtDate(item.deadline)+'</td>'
    +'<td><button data-del="'+item.id+'" class="row-del">Delete</button></td>';
  return tr;
}

function render(){
  var total=allItems.length,done=allItems.filter(function(i){return i.status==='done';}).length;
  var pct=total?Math.round(done/total*100):0;
  var prog=document.getElementById('cl-progress');
  if(total){prog.style.display='block';document.getElementById('cl-prog-text').textContent=done+' of '+total+' complete';document.getElementById('cl-prog-pct').textContent=pct+'%';document.getElementById('cl-prog-fill').style.width=pct+'%';}
  else prog.style.display='none';
  document.getElementById('cl-reset-btn').style.display=total?'inline-flex':'none';
  var hideBtn=document.getElementById('cl-hide-btn');
  hideBtn.textContent=hideDone?'Show completed':'Hide completed';
  hideBtn.style.background=hideDone?'var(--amber-light)':'';
  hideBtn.style.borderColor=hideDone?'var(--amber)':'';
  hideBtn.style.color=hideDone?'var(--amber-dark)':'';
  var sorted=[].concat(allItems).sort(function(a,b){return STAGE_ORDER.indexOf(a.stage||'planning')-STAGE_ORDER.indexOf(b.stage||'planning');});
  var visible=hideDone?sorted.filter(function(i){return i.status!=='done';}):sorted;
  var el=document.getElementById('cl-content');
  if(!total){el.innerHTML='<div class="empty-state"><div class="icon">&#x2705;</div><h3>No tasks yet</h3><p>Add tasks manually or load a template.</p><button class="btn amber" onclick="openTplModal()">Choose template</button></div>';return;}
  var wrap=document.createElement('div'); wrap.className='table-wrap table-scroll';
  var tbl=document.createElement('table');
  tbl.innerHTML='<thead><tr><th>Stage</th><th>Category</th><th>Task</th><th style="width:40px;text-align:center;">Done</th><th>Status</th><th>Who</th><th>Deadline</th><th></th></tr></thead>';
  var tbody=document.createElement('tbody');
  visible.forEach(function(item){tbody.appendChild(buildRow(item));});
  var tfoot=document.createElement('tfoot');
  tfoot.innerHTML='<tr class="add-row"><td colspan="8">+ Add task</td></tr>';
  tfoot.querySelector('.add-row').addEventListener('click',addTask);
  tbl.appendChild(tbody); tbl.appendChild(tfoot); wrap.appendChild(tbl);
  el.innerHTML=''; el.appendChild(wrap);
  el.querySelectorAll('.cl-check').forEach(function(box){
    box.addEventListener('click',function(){toggleDone(box.dataset.id,box.dataset.status);});
  });
  el.querySelectorAll('[data-del]').forEach(function(btn){
    btn.addEventListener('click',function(){deleteItem(btn.dataset.del);});
  });
}

async function toggleDone(id,status){
  var ns=status==='done'?'not_started':'done';
  var item=allItems.find(function(i){return i.id===id;});
  if(item)item.status=ns;
  render();
  await sb.from('checklist_items').update({status:ns}).eq('id',id);
}
async function addTask(){
  var res=await sb.from('checklist_items').insert([{event_id:eventId,stage:'planning',category:'',task:'',status:'not_started',who:'',deadline:null}]).select().single();
  if(!res.error&&res.data){allItems.push(res.data);render();}
}
async function deleteItem(id){
  if(!confirm('Delete this task?'))return;
  await sb.from('checklist_items').delete().eq('id',id);
  allItems=allItems.filter(function(i){return i.id!==id;});
  render();
}
async function resetAll(){
  if(!confirm('Delete all tasks?'))return;
  await sb.from('checklist_items').delete().eq('event_id',eventId);
  allItems=[];render();
}
function toggleHide(){hideDone=!hideDone;render();}
function openTplModal(){document.getElementById('tpl-modal').classList.add('open');}
function closeTplModal(){document.getElementById('tpl-modal').classList.remove('open');}
async function loadTemplate(type){
  closeTplModal();
  if(allItems.length&&!confirm('Add template tasks to your existing checklist?'))return;
  var tmpl=TEMPLATES[type];if(!tmpl)return;
  var rows=tmpl.map(function(t){return Object.assign({},t,{event_id:eventId,status:'not_started'});});
  var res=await sb.from('checklist_items').insert(rows).select();
  if(!res.error&&res.data){allItems=allItems.concat(res.data);render();}
}
init();

</script>
</body>
</html>
