<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octevent — Table plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --amber:#F5A800;--amber-light:#FFF8E6;--amber-dark:#C98A00;
  --ink:#18181A;--ink2:#555;--ink3:#999;--cream:#FAFAF7;--rule:#ECEAE4;
}
html,body{min-height:100%;background:var(--cream);}
body{font-family:'DM Sans',sans-serif;color:var(--ink);}

/* NAV */
nav{background:#fff;border-bottom:1px solid var(--rule);padding:0 2.5rem;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.nav-left{display:flex;align-items:center;gap:1rem;}
.nav-logo img{height:36px;width:auto;}
.nav-breadcrumb{display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--ink3);}
.nav-breadcrumb a{color:var(--ink3);text-decoration:none;}
.nav-breadcrumb a:hover{color:var(--ink);}
.nav-breadcrumb span{color:var(--ink);font-weight:500;}
.nav-right{display:flex;align-items:center;gap:0.75rem;}
.nav-avatar{width:34px;height:34px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;color:var(--ink);}
.btn-sm{font-size:0.78rem;font-weight:500;padding:0.5rem 1rem;border-radius:100px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);background:#fff;color:var(--ink2);}
.btn-sm:hover{border-color:var(--ink);color:var(--ink);}
.btn-sm.amber{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:600;}
.btn-sm.amber:hover{background:var(--amber-dark);border-color:var(--amber-dark);color:#fff;}

/* EVENT HEADER */
.event-header{background:#fff;border-bottom:1px solid var(--rule);padding:1.75rem 2.5rem;}
.event-header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.25rem;}
.event-title{font-family:'Nunito',sans-serif;font-size:2rem;font-weight:800;line-height:1.1;}
.event-meta{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:0.4rem;}
.event-meta-item{display:flex;align-items:center;gap:6px;font-size:0.8rem;color:var(--ink3);}
.event-meta-item svg{width:13px;height:13px;}
.event-status{font-size:0.65rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:4px 12px;border-radius:100px;}
.status-upcoming{background:var(--amber-light);color:var(--amber-dark);}
.status-live{background:#f0f7f4;color:#2d6a4f;}
.status-past{background:var(--rule);color:var(--ink3);}

.event-stat{background:#fff;padding:0.85rem 1rem;text-align:center;}
.event-stat-n{font-family:'Nunito',sans-serif;font-size:1.5rem;font-weight:800;line-height:1;color:var(--ink);}
.event-stat-l{font-size:0.65rem;color:var(--ink3);text-transform:uppercase;letter-spacing:0.05em;margin-top:4px;}

/* TABS */
.tabs-bar{background:#fff;border-bottom:1px solid var(--rule);padding:0 2.5rem;display:flex;gap:0;overflow-x:auto;}
.tab{padding:1rem 1.25rem;font-size:0.85rem;font-weight:500;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all 0.2s;background:none;border-top:none;border-left:none;border-right:none;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px;}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--ink);border-bottom-color:var(--amber);}

/* MAIN */
main{max-width:100%;padding:2rem 2.5rem;}
.panel{display:none;}
.panel.active{display:block;}

/* PANEL HEADER */
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;}
.panel-title{font-family:'Nunito',sans-serif;font-size:1.3rem;font-weight:800;}

/* OVERVIEW */
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.overview-card{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:1.5rem;}
.overview-card h3{font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;margin-bottom:1rem;display:flex;align-items:center;gap:8px;}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:0.6rem 0;border-bottom:1px solid var(--rule);font-size:0.83rem;}
.detail-row:last-child{border-bottom:none;}
.detail-label{color:var(--ink3);}
.detail-value{color:var(--ink);font-weight:500;text-align:right;}
.quick-actions{display:flex;flex-direction:column;gap:8px;}
.quick-action{display:flex;align-items:center;gap:10px;padding:0.75rem;border:1px solid var(--rule);border-radius:10px;cursor:pointer;transition:all 0.2s;font-size:0.83rem;font-weight:500;background:#fff;font-family:'DM Sans',sans-serif;color:var(--ink);text-align:left;}
.quick-action:hover{border-color:var(--amber);background:var(--amber-light);}
.quick-action-icon{width:32px;height:32px;border-radius:8px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;}

/* GUESTS */
.search-bar{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--rule);border-radius:100px;padding:0.5rem 1rem;font-size:0.85rem;transition:border-color 0.2s;}
.search-bar:focus-within{border-color:var(--amber);}
.search-bar input{border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:0.85rem;color:var(--ink);background:transparent;width:180px;}
.search-bar svg{width:14px;height:14px;flex-shrink:0;}
.table-wrap{background:#fff;border:1px solid var(--rule);border-radius:16px;overflow:hidden;}
.table-wrap-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead{background:var(--cream);}
th{padding:0.75rem 1rem;text-align:left;font-size:0.72rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--rule);}
td{padding:0.85rem 1rem;font-size:0.83rem;border-bottom:1px solid var(--rule);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--cream);}
.guest-name{font-weight:500;}
.guest-email{font-size:0.75rem;color:var(--ink3);}
.rsvp-badge{font-size:0.65rem;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;}
.rsvp-confirmed{background:#f0f7f4;color:#2d6a4f;}
.rsvp-pending{background:var(--amber-light);color:var(--amber-dark);}
.rsvp-declined{background:#fdf0f0;color:#9b2c2c;}

/* BUDGET */
.budget-summary{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:1.25rem;}
.budget-card{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:0.9rem 1rem;}
.budget-card-label{font-size:0.68rem;color:var(--ink3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.35rem;}
.budget-card-value{font-family:'Nunito',sans-serif;font-size:1.3rem;font-weight:800;color:var(--ink);}
.budget-card-value.green{color:#2d6a4f;}
.budget-card-value.amber{color:var(--amber-dark);}
.budget-card-value.red{color:#c0392b;}
table.budget-table{width:100%;border-collapse:collapse;}
table.budget-table thead{background:var(--cream);position:sticky;top:0;}
table.budget-table th{padding:0.7rem 0.85rem;text-align:left;font-size:0.68rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--rule);white-space:nowrap;}
table.budget-table th.num{text-align:right;}
table.budget-table th.sortable{cursor:pointer;user-select:none;}
table.budget-table th.sortable:hover{color:var(--ink);}
table.budget-table th .sort-icon{opacity:0.3;font-size:0.7rem;margin-left:3px;}
table.budget-table th.sort-asc .sort-icon,table.budget-table th.sort-desc .sort-icon{opacity:1;color:var(--amber-dark);}
table.budget-table td{padding:0.75rem 0.85rem;font-size:0.82rem;border-bottom:1px solid var(--rule);vertical-align:middle;cursor:pointer;}
table.budget-table td.num{text-align:right;font-family:'Nunito',sans-serif;font-weight:600;}
table.budget-table td.num.red{color:#c0392b;}
table.budget-table td.num.green{color:#2d6a4f;}
table.budget-table tr:hover td{background:var(--amber-light);}
table.budget-table tr.add-row td{cursor:pointer;color:var(--ink3);font-size:0.82rem;border-top:2px solid var(--rule);}
table.budget-table tr.add-row:hover td{background:var(--amber-light);color:var(--ink);}
table.budget-table tfoot tr:first-child td{padding:0.85rem;font-weight:700;font-size:0.85rem;background:var(--cream);border-top:2px solid var(--rule);font-family:'Nunito',sans-serif;}
table.budget-table tfoot tr:first-child td.num{text-align:right;}
td.editing{padding:2px !important;background:#fff !important;}
.inline-input{width:100%;padding:5px 8px;border:2px solid var(--amber);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:0.82rem;color:var(--ink);outline:none;background:#fff;}
.inline-select{width:100%;padding:5px 6px;border:2px solid var(--amber);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:0.78rem;color:var(--ink);outline:none;background:#fff;cursor:pointer;}
.category-badge{font-size:0.65rem;font-weight:600;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;}
.cat-venue{background:#e8f4fd;color:#1a6fa8;}
.cat-catering{background:#fdf6ec;color:#92600a;}
.cat-flowers{background:#fdf0f7;color:#8b2a6e;}
.cat-music{background:#f0f0fd;color:#4a4aab;}
.cat-photography{background:#f0f7f4;color:#2d6a4f;}
.cat-transport{background:#fdf0f0;color:#9b2c2c;}
.cat-accommodation{background:#fff8e6;color:#c98a00;}
.cat-staffing{background:#f5f0fd;color:#6b3fa0;}
.cat-decor{background:#fdf5f0;color:#a04a1a;}
.cat-other{background:var(--rule);color:var(--ink3);}
.cat-room_rental{background:#e8f7f0;color:#1a7a4a;}
.cat-ticket_sales{background:#e8f0fd;color:#1a3fa8;}
.cat-sponsorship{background:#f0fde8;color:#3a7a1a;}
.cat-client_payment{background:#fde8f7;color:#a81a7a;}
.cat-other_income{background:#f7f0e8;color:#7a4a1a;}
.paid-badge{font-size:0.62rem;font-weight:600;padding:2px 8px;border-radius:20px;}
.paid-yes{background:#f0f7f4;color:#2d6a4f;}
.paid-no{background:#fdf0f0;color:#9b2c2c;}
.type-badge{font-size:0.65rem;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;}
.type-expense{background:#fdf0f0;color:#9b2c2c;}
.type-income{background:#f0f7f4;color:#2d6a4f;}
.paid-partial{background:#fff8e6;color:#c98a00;}
.row-del{font-size:0.72rem;padding:3px 8px;border-radius:6px;border:1px solid var(--rule);background:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--ink2);opacity:0;transition:all 0.15s;}
tr:hover .row-del{opacity:1;}
.row-del:hover{border-color:#e53e3e;color:#e53e3e;}

/* COMING SOON */
.coming-soon{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:4rem 2rem;text-align:center;}
.coming-soon-icon{font-size:2.5rem;margin-bottom:1rem;}
.coming-soon h3{font-family:'Nunito',sans-serif;font-size:1.2rem;font-weight:800;margin-bottom:0.5rem;}
.coming-soon p{font-size:0.85rem;color:var(--ink3);font-weight:300;}
.coming-badge{display:inline-block;margin-top:1rem;font-size:0.7rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;background:var(--amber-light);color:var(--amber-dark);padding:5px 14px;border-radius:100px;}

/* EMPTY STATE */
.empty-state{text-align:center;padding:4rem 2rem;background:#fff;border:1px solid var(--rule);border-radius:16px;}
.empty-icon{font-size:2.5rem;margin-bottom:0.75rem;opacity:0.4;}
.empty-state h3{font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:800;margin-bottom:0.4rem;}
.empty-state p{font-size:0.85rem;color:var(--ink3);margin-bottom:1.25rem;font-weight:300;}

/* SETTINGS */
.field{margin-bottom:1rem;}
.field label{display:block;font-size:0.78rem;font-weight:500;color:var(--ink2);margin-bottom:0.4rem;}
.field input,.field select,.field textarea{width:100%;padding:0.8rem 1rem;border:1.5px solid var(--rule);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.88rem;color:var(--ink);background:#fff;outline:none;transition:border-color 0.2s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber);}
.field textarea{resize:vertical;min-height:80px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.photo-upload{border:2px dashed var(--rule);border-radius:12px;height:160px;cursor:pointer;overflow:hidden;transition:border-color 0.2s;background:var(--cream);margin-bottom:0;}
.photo-upload:hover,.photo-upload.dragover{border-color:var(--amber);background:var(--amber-light);}
.photo-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:6px;color:var(--ink3);font-size:0.82rem;}
.photo-placeholder svg{opacity:0.4;}
.photo-placeholder small{font-size:0.7rem;opacity:0.7;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1.5rem;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:#fff;border-radius:20px;width:100%;max-width:480px;padding:2rem;transform:translateY(20px);transition:transform 0.2s;}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;}
.modal-title{font-family:'Nunito',sans-serif;font-size:1.2rem;font-weight:800;}
.modal-close{width:30px;height:30px;border-radius:50%;background:var(--cream);border:none;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:1.5rem;}
.btn-cancel{padding:0.7rem 1.25rem;border-radius:100px;border:1.5px solid var(--rule);background:#fff;color:var(--ink2);font-family:'DM Sans',sans-serif;font-size:0.83rem;font-weight:500;cursor:pointer;}
.btn-primary{padding:0.7rem 1.5rem;border-radius:100px;background:var(--amber);color:var(--ink);border:none;font-family:'DM Sans',sans-serif;font-size:0.83rem;font-weight:600;cursor:pointer;transition:all 0.2s;}
.btn-primary:hover{background:var(--amber-dark);color:#fff;}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;}

/* SPINNER */
.spinner{width:28px;height:28px;border:3px solid var(--rule);border-top-color:var(--amber);border-radius:50%;animation:spin 0.7s linear infinite;margin:3rem auto;display:block;}
@keyframes spin{to{transform:rotate(360deg);}}

/* MOBILE */
@media(max-width:768px){
  nav{padding:0 1rem;height:56px;}
  .nav-logo img{height:28px;}
  .nav-breadcrumb{display:none;}
  .btn-sm span{display:none;}
  .event-header{padding:1.25rem 1rem;}
  .event-title{font-size:1.4rem;}
  .event-stats{grid-template-columns:repeat(2,1fr);}
  .tabs-bar{padding:0 1rem;}
  .tab{padding:0.85rem 0.75rem;font-size:0.78rem;}
  main{padding:1.25rem 1rem;}
  .overview-grid{grid-template-columns:1fr;}
  .panel-header{flex-direction:column;align-items:flex-start;gap:0.75rem;}
  .search-bar input{width:130px;}
  .budget-summary{grid-template-columns:repeat(3,1fr);}
  .table-wrap-scroll{overflow-x:auto;}
  .field-row{grid-template-columns:1fr;}
  .modal-overlay{padding:0.75rem;}
  .event-header-top{flex-direction:column;}
}
@media(max-width:480px){
  .budget-summary{grid-template-columns:repeat(2,1fr);}
  .tab{padding:0.75rem 0.6rem;font-size:0.72rem;}
  .event-stat-n{font-size:1.2rem;}
}

.mobile-only{display:none;}
@media(max-width:1024px){
  .mobile-only{display:inline-flex;}
  .budget-summary{grid-template-columns:repeat(2,1fr);}
}

/* BUDGET MOBILE CARDS */
@media(max-width:768px){
  .budget-table-wrap{display:none;}
  .budget-cards{display:flex;flex-direction:column;gap:10px;}
  .budget-card-row{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:1rem;}
  .budget-card-row-header{display:flex;align-items:center;gap:8px;margin-bottom:0.75rem;flex-wrap:wrap;}
  .budget-card-row-amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:0.5rem;}
  .budget-card-row-amount{text-align:center;padding:0.5rem;background:var(--cream);border-radius:8px;}
  .budget-card-row-amount-label{font-size:0.62rem;color:var(--ink3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;}
  .budget-card-row-amount-value{font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:700;}
  .budget-card-row-footer{display:flex;justify-content:space-between;align-items:center;margin-top:0.5rem;font-size:0.78rem;color:var(--ink3);}
}
@media(min-width:769px){
  .budget-cards{display:none;}
}

/* CHECKLIST */
.checklist-progress{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;}
.progress-label{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--ink2);margin-bottom:0.5rem;}
.progress-bar{height:8px;background:var(--rule);border-radius:100px;overflow:hidden;}
.progress-fill{height:100%;background:var(--amber);border-radius:100px;transition:width 0.4s ease;}
table.checklist-table{width:100%;border-collapse:collapse;}
table.checklist-table thead{background:var(--cream);}
table.checklist-table th{padding:0.7rem 0.85rem;text-align:left;font-size:0.68rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none;}
table.checklist-table th:hover{color:var(--ink);}
table.checklist-table th .sort-icon{opacity:0.3;font-size:0.7rem;margin-left:3px;}
table.checklist-table th.sort-asc .sort-icon,table.checklist-table th.sort-desc .sort-icon{opacity:1;color:var(--amber-dark);}
table.checklist-table td{padding:0.75rem 0.85rem;font-size:0.82rem;border-bottom:1px solid var(--rule);vertical-align:middle;cursor:pointer;}
table.checklist-table tr:last-child td{border-bottom:none;}
table.checklist-table tr:hover td{background:var(--amber-light);}
table.checklist-table tr.done-row td{opacity:0.5;}
table.checklist-table tr.done-row td .task-name{text-decoration:line-through;}
table.checklist-table tr.add-row td{cursor:pointer;color:var(--ink3);font-size:0.82rem;border-top:2px solid var(--rule);}
table.checklist-table tr.add-row:hover td{background:var(--amber-light);color:var(--ink);}
.stage-badge{font-size:0.65rem;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;}
.stage-planning{background:#e8f0fd;color:#1a3fa8;}
.stage-booking{background:#fdf6ec;color:#92600a;}
.stage-confirmed{background:#f0f7f4;color:#2d6a4f;}
.stage-on_the_day{background:var(--amber-light);color:var(--amber-dark);}
.stage-post_event{background:var(--rule);color:var(--ink3);}
.cl-status-badge{font-size:0.65rem;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;}
.cl-not_started{background:var(--rule);color:var(--ink3);}
.cl-in_progress{background:#e8f0fd;color:#1a3fa8;}
.cl-done{background:#f0f7f4;color:#2d6a4f;}
.cl-blocked{background:#fdf0f0;color:#9b2c2c;}
.done-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--rule);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;}
.done-check.checked{background:var(--amber);border-color:var(--amber);}
.done-check.checked::after{content:'✓';font-size:11px;color:var(--ink);font-weight:700;}
.task-name{font-weight:500;}

/* CHECKLIST MOBILE CARDS */
.checklist-cards{display:none;flex-direction:column;gap:10px;margin-top:0.5rem;}
.checklist-card{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:1rem;}
.checklist-card.done{opacity:0.6;}
.checklist-card-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:0.75rem;}
.checklist-card-title{font-weight:600;font-size:0.9rem;flex:1;}
.checklist-card-title.done{text-decoration:line-through;}
.checklist-card-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0.5rem;}
.checklist-card-footer{display:flex;justify-content:space-between;align-items:center;font-size:0.75rem;color:var(--ink3);margin-top:0.5rem;}

/* TEMPLATE MODAL */
.template-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:0.5rem;}
.template-card{border:1.5px solid var(--rule);border-radius:12px;padding:1.25rem;cursor:pointer;transition:all 0.2s;text-align:center;}

.template-card-icon{font-size:1.75rem;margin-bottom:0.5rem;}
.template-card-name{font-size:0.88rem;font-weight:600;}
.template-card-count{font-size:0.75rem;color:var(--ink3);margin-top:2px;}

@media(max-width:1024px){
  .checklist-cards{display:flex;}
  #checklist-wrap{display:none;}
}

.checklist-start{padding:3rem 2rem;background:#fff;border:1px solid var(--rule);border-radius:16px;text-align:center;}
.checklist-start-title{font-family:'Nunito',sans-serif;font-size:1.2rem;font-weight:800;margin-bottom:1.5rem;color:var(--ink);}
.checklist-start-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:500px;margin:0 auto;}
.checklist-start-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.checklist-start-row .checklist-start-card{flex:0 0 130px;width:130px;min-height:130px;aspect-ratio:1;}
.checklist-start-card{border:2px solid var(--rule);border-radius:16px;padding:2rem 1.5rem;cursor:pointer;transition:all 0.2s;background:#fff;}
.checklist-start-card:hover{border-color:var(--amber);background:var(--amber-light);transform:translateY(-2px);}
.checklist-start-icon{font-size:2rem;margin-bottom:0.75rem;}
.checklist-start-name{font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;margin-bottom:0.4rem;}
.checklist-start-desc{font-size:0.8rem;color:var(--ink3);font-weight:300;line-height:1.5;}
@media(max-width:480px){.checklist-start-grid{grid-template-columns:1fr;}}

.event-title-row{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:1rem;margin-bottom:1rem;
}
.event-lower-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:90px 90px;
  height:180px;
  gap:1px;
  background:var(--rule);
  border:1px solid var(--rule);
  border-radius:12px;
  overflow:hidden;
}
.event-cover-strip{
  grid-column:1;
  grid-row:1/3;
  display:none;
  overflow:hidden;
  height:180px;
}
.event-cover-strip img{
  width:100%;height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}
.event-stats{
  grid-column:2/4;
  grid-row:1/3;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:1px;
  background:var(--rule);
}
/* When no cover, stats take full width */
.event-lower-row:not(.has-cover) .event-stats{
  grid-column:1/4;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:1fr;
}
.event-lower-row:not(.has-cover) .event-cover-strip{
  display:none !important;
}
@media(max-width:768px){
  .event-lower-row{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;}
  .event-cover-strip{grid-column:1/3;grid-row:1;min-height:130px;display:none;}
  .event-cover-strip.visible{display:block !important;}
  .event-stats{grid-column:1/3;grid-row:2;grid-template-columns:1fr 1fr;}
  .event-lower-row:not(.has-cover) .event-stats{grid-template-columns:1fr 1fr;grid-row:1;}
  .event-title-row{flex-direction:column;}
}

/* RUN SHEET */
table.runsheet-table{width:100%;border-collapse:collapse;}
table.runsheet-table thead{background:var(--cream);}
table.runsheet-table th{padding:0.7rem 0.85rem;text-align:left;font-size:0.68rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none;}
table.runsheet-table th:hover{color:var(--ink);}
table.runsheet-table th .sort-icon{opacity:0.3;font-size:0.7rem;margin-left:3px;}
table.runsheet-table th.sort-asc .sort-icon,table.runsheet-table th.sort-desc .sort-icon{opacity:1;color:var(--amber-dark);}
table.runsheet-table td{padding:0.75rem 0.85rem;font-size:0.82rem;border-bottom:1px solid var(--rule);vertical-align:middle;cursor:pointer;}
table.runsheet-table tr:last-child td{border-bottom:none;}
table.runsheet-table tr:hover td{background:var(--amber-light);}
table.runsheet-table tr.rs-done td{opacity:0.45;}
table.runsheet-table tr.rs-done .rs-action{text-decoration:line-through;}
table.runsheet-table tr.add-row td{cursor:pointer;color:var(--ink3);font-size:0.82rem;border-top:2px solid var(--rule);}
table.runsheet-table tr.add-row:hover td{background:var(--amber-light);color:var(--ink);}
.rs-time{font-family:'Nunito',sans-serif;font-weight:700;font-size:0.85rem;color:var(--ink);white-space:nowrap;}
.rs-hours{font-family:'Nunito',sans-serif;font-weight:600;font-size:0.82rem;color:var(--ink3);}
.rs-action{font-weight:500;}
.rs-done-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--rule);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;margin:0 auto;}
.rs-done-check.checked{background:var(--amber);border-color:var(--amber);}
.rs-done-check.checked::after{content:'✓';font-size:11px;color:var(--ink);font-weight:700;}

/* RUN SHEET MOBILE CARDS */
.runsheet-cards{display:none;flex-direction:column;gap:8px;margin-top:0.5rem;}
.runsheet-card{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:1rem;}
.runsheet-card.done{opacity:0.5;}
.runsheet-card-header{display:flex;align-items:center;gap:10px;margin-bottom:0.5rem;}
.runsheet-card-time{font-family:'Nunito',sans-serif;font-weight:700;font-size:0.95rem;color:var(--amber-dark);}
.runsheet-card-action{font-weight:600;font-size:0.9rem;flex:1;}
.runsheet-card-meta{font-size:0.78rem;color:var(--ink3);display:flex;gap:1rem;flex-wrap:wrap;}
.runsheet-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:0.6rem;}

@media(max-width:1024px){
  .runsheet-cards{display:flex;}
  #runsheet-wrap{display:none;}
}

/* TABLE PLAN */
.tableplan-desktop{display:block;}
.tableplan-mobile{display:none;}
.tableplan-layout{display:grid;grid-template-columns:220px 1fr;gap:0;height:600px;border:1px solid var(--rule);border-radius:16px;overflow:hidden;background:#fff;}
.tp-sidebar{border-right:1px solid var(--rule);display:flex;flex-direction:column;background:var(--cream);}
.tp-sidebar-title{font-size:0.72rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink3);padding:1rem 1rem 0.5rem;}
.tp-sidebar-search input{width:calc(100% - 1.5rem);margin:0 0.75rem 0.75rem;padding:0.5rem 0.75rem;border:1px solid var(--rule);border-radius:8px;font-size:0.8rem;font-family:'DM Sans',sans-serif;outline:none;}
.tp-sidebar-search input:focus{border-color:var(--amber);}
.tp-guest-list{flex:1;overflow-y:auto;padding:0 0.5rem 0.5rem;}
.tp-guest-chip{
  padding:0.5rem 0.75rem;margin-bottom:4px;background:#fff;
  border:1px solid var(--rule);border-radius:8px;font-size:0.78rem;
  cursor:grab;user-select:none;transition:all 0.15s;
  display:flex;align-items:center;gap:6px;
}
.tp-guest-chip:hover{border-color:var(--amber);background:var(--amber-light);}
.tp-guest-chip.dragging{opacity:0.5;cursor:grabbing;}
.tp-guest-chip-avatar{width:22px;height:22px;border-radius:50%;background:var(--amber);color:var(--ink);font-size:0.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tp-canvas-wrap{overflow:auto;position:relative;background:#f5f5f0;}
.tp-canvas{
  min-width:100%;min-height:100%;position:relative;
  background-image:radial-gradient(circle, #ddd 1px, transparent 1px);
  background-size:24px 24px;
}
.tp-canvas-empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--ink3);}

/* TABLE ELEMENT */
.tp-table{
  position:absolute;cursor:move;user-select:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.tp-table-inner{
  position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  border:2px solid var(--amber);background:#fff;
  transition:border-color 0.15s;
}
.tp-table-inner:hover{border-color:var(--amber-dark);}
.tp-table-inner.dragover{background:var(--amber-light);border-color:var(--amber-dark);}
.tp-table.round .tp-table-inner{border-radius:50%;}
.tp-table.rect .tp-table-inner{border-radius:12px;}
.tp-table-name{font-family:'Nunito',sans-serif;font-weight:800;font-size:0.8rem;color:var(--ink);text-align:center;padding:4px;}
.tp-table-count{font-size:0.65rem;color:var(--ink3);}
.tp-table-controls{display:none;position:absolute;top:-28px;left:50%;transform:translateX(-50%);gap:4px;white-space:nowrap;}
.tp-table:hover .tp-table-controls{display:flex;}
.tp-table-btn{font-size:0.65rem;padding:2px 8px;border-radius:20px;border:1px solid var(--rule);background:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--ink2);}
.tp-table-btn:hover{border-color:var(--ink);color:var(--ink);}
.tp-table-btn.del:hover{border-color:#e53e3e;color:#e53e3e;}
.tp-seat-row{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;padding:4px 8px;max-width:140px;}
.tp-seat{width:18px;height:18px;border-radius:50%;background:var(--cream);border:1px solid var(--rule);cursor:pointer;font-size:0.5rem;display:flex;align-items:center;justify-content:center;}
.tp-seat.filled{background:var(--amber);border-color:var(--amber-dark);}

/* MOBILE TABLE PLAN */
.tp-mobile-tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:1rem;}
.tp-mobile-tab{flex:1;padding:0.75rem;font-size:0.85rem;font-weight:500;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;border-top:none;border-left:none;border-right:none;font-family:'DM Sans',sans-serif;transition:all 0.2s;}
.tp-mobile-tab.active{color:var(--ink);border-bottom-color:var(--amber);}
.tp-mobile-table-card{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:1rem;margin-bottom:10px;}
.tp-mobile-table-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;}
.tp-mobile-table-name{font-family:'Nunito',sans-serif;font-weight:800;font-size:0.95rem;}
.tp-mobile-table-badge{font-size:0.65rem;padding:2px 8px;border-radius:20px;background:var(--amber-light);color:var(--amber-dark);font-weight:600;}
.tp-mobile-guest-row{display:flex;align-items:center;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid var(--rule);font-size:0.82rem;}
.tp-mobile-guest-row:last-child{border-bottom:none;}
.tp-assign-select{font-size:0.78rem;padding:4px 8px;border:1px solid var(--rule);border-radius:8px;font-family:'DM Sans',sans-serif;outline:none;color:var(--ink);}
.tp-assign-select:focus{border-color:var(--amber);}

@media(max-width:1024px){
  .tableplan-desktop{display:none;}
  .tableplan-mobile{display:block;}
}

.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.ov-card{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:0.4rem;cursor:pointer;transition:all 0.2s;}
.ov-card:hover{border-color:var(--amber);transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,0.06);}
.ov-card-label{font-size:0.7rem;color:var(--ink3);text-transform:uppercase;letter-spacing:0.08em;font-weight:500;display:flex;align-items:center;gap:6px;}
.ov-card-value{font-family:'Nunito',sans-serif;font-size:2rem;font-weight:800;color:var(--ink);line-height:1;}
.ov-card-sub{font-size:0.75rem;color:var(--ink3);font-weight:300;}
.ov-progress{height:6px;background:var(--rule);border-radius:100px;overflow:hidden;margin-top:4px;}
.ov-progress-fill{height:100%;background:var(--amber);border-radius:100px;transition:width 0.5s ease;}
.ov-progress-fill.green{background:#2d6a4f;}
.ov-section-title{font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;margin:0.5rem 0 0.75rem;color:var(--ink);}
.ov-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.quick-action{display:flex;align-items:center;gap:10px;padding:0.75rem;border:1px solid var(--rule);border-radius:10px;cursor:pointer;transition:all 0.2s;font-size:0.83rem;font-weight:500;background:#fff;font-family:'DM Sans',sans-serif;color:var(--ink);text-align:left;}
.quick-action:hover{border-color:var(--amber);background:var(--amber-light);}
.quick-action-icon{width:32px;height:32px;border-radius:8px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;}
@media(max-width:768px){
  .ov-grid{grid-template-columns:repeat(2,1fr);}
  .ov-quick{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:480px){
  .ov-grid{grid-template-columns:1fr 1fr;}
  .ov-quick{grid-template-columns:1fr 1fr;}
}

let tpTables = [];
let tpGuests = [];
let tpDragGuest = null;
let tpDragTable = null;
let tpDragOffsetX = 0;
let tpDragOffsetY = 0;

async function loadTablePlan() {
  // Load guests
  const { data: gData } = await sb.from('guests').select('*').eq('event_id', eventId);
  tpGuests = gData || [];

  // Load tables from event
  const { data: evData } = await sb.from('events').select('table_plan').eq('id', eventId).single();
  tpTables = evData?.table_plan || [];
  if (!Array.isArray(tpTables)) tpTables = [];

  renderTablePlan();
}

function renderTablePlan() {
  renderCanvas();
  renderTpSidebar();
  renderTpMobile();
}

function getAssignedGuestIds() {
  const ids = new Set();
  tpTables.forEach(t => (t.guests||[]).forEach(id => ids.add(id)));
  return ids;
}

function getGuestName(id) {
  const g = tpGuests.find(g=>g.id===id);
  return g ? `${g.first_name} ${g.last_name||''}`.trim() : '?';
}

function getGuestInitials(id) {
  const g = tpGuests.find(g=>g.id===id);
  if (!g) return '?';
  return ((g.first_name||'')[0]||(g.last_name||'')[0]||'?').toUpperCase();
}

function renderCanvas() {
  const canvas = document.getElementById('tp-canvas');
  const empty = document.getElementById('tp-canvas-empty');
  if (!canvas) return;

  // Remove old tables
  canvas.querySelectorAll('.tp-table').forEach(el => el.remove());

  if (tpTables.length === 0) {
    if (empty) empty.style.display = 'block';
    return;
  }
  if (empty) empty.style.display = 'none';

  tpTables.forEach(table => {
    const el = createTableEl(table);
    canvas.appendChild(el);
  });
}

function createTableEl(table) {
  const size = table.shape === 'round' ? 120 : null;
  const w = table.shape === 'round' ? 120 : (table.w||160);
  const h = table.shape === 'round' ? 120 : (table.h||100);

  const wrap = document.createElement('div');
  wrap.className = `tp-table ${table.shape}`;
  wrap.dataset.id = table.id;
  wrap.style.cssText = `left:${table.x||80}px;top:${table.y||80}px;width:${w}px;height:${h}px;`;

  const assigned = (table.guests||[]).length;
  const capacity = table.capacity||8;

  wrap.innerHTML = `
    <div class="tp-table-controls">
      <button class="tp-table-btn" onclick="renameTable('${table.id}')">Rename</button>
      <button class="tp-table-btn" onclick="resizeTable('${table.id}')">Seats</button>
      <button class="tp-table-btn del" onclick="removeTable('${table.id}')">Remove</button>
    </div>
    <div class="tp-table-inner" style="width:${w}px;height:${h}px;" id="ti-${table.id}">
      <div class="tp-table-name">${table.name}</div>
      <div class="tp-table-count">${assigned}/${capacity}</div>
      <div class="tp-seat-row">
        ${(table.guests||[]).map(gid => `<div class="tp-seat filled" title="${getGuestName(gid)}" onclick="removeGuestFromTable('${table.id}','${gid}')">${getGuestInitials(gid)}</div>`).join('')}
        ${Array(Math.max(0,capacity-assigned)).fill('<div class="tp-seat"></div>').join('')}
      </div>
    </div>`;

  // Drag to move table
  wrap.addEventListener('mousedown', e => {
    if (e.target.closest('.tp-table-btn') || e.target.closest('.tp-seat')) return;
    tpDragTable = table;
    const rect = wrap.getBoundingClientRect();
    tpDragOffsetX = e.clientX - rect.left;
    tpDragOffsetY = e.clientY - rect.top;
    e.preventDefault();
  });

  // Drop guest onto table
  const inner = wrap.querySelector('.tp-table-inner');
  inner.addEventListener('dragover', e => { e.preventDefault(); inner.classList.add('dragover'); });
  inner.addEventListener('dragleave', () => inner.classList.remove('dragover'));
  inner.addEventListener('drop', e => {
    e.preventDefault();
    inner.classList.remove('dragover');
    const guestId = e.dataTransfer.getData('guestId');
    if (guestId) assignGuestToTable(table.id, guestId);
  });

  return wrap;
}

// Mouse move for table dragging
document.addEventListener('mousemove', e => {
  if (!tpDragTable) return;
  const canvas = document.getElementById('tp-canvas');
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const x = Math.max(0, e.clientX - rect.left - tpDragOffsetX);
  const y = Math.max(0, e.clientY - rect.top - tpDragOffsetY);
  tpDragTable.x = x;
  tpDragTable.y = y;
  const el = canvas.querySelector(`[data-id="${tpDragTable.id}"]`);
  if (el) { el.style.left = x+'px'; el.style.top = y+'px'; }
});

document.addEventListener('mouseup', () => { tpDragTable = null; });

      </select>

  : `<div style="text-align:center;padding:2rem;color:var(--ink3);font-size:0.85rem;">🎉 All guests assigned!</div>`;
}

function addTable(shape) {
  const name = prompt(`Table name:`, `Table ${tpTables.length+1}`);
  if (!name) return;
  const capacity = parseInt(prompt('Number of seats:', shape==='round'?'8':'10'))||8;
  tpTables.push({
    id: Date.now().toString(),
    name, shape, capacity,
    x: 80 + (tpTables.length%4)*180,
    y: 80 + Math.floor(tpTables.length/4)*180,
    w: shape==='rect'?160:120,
    h: shape==='rect'?100:120,
    guests: []
  });
  renderTablePlan();
}

function renameTable(id) {
  const table = tpTables.find(t=>t.id===id);
  if (!table) return;
  const name = prompt('New table name:', table.name);
  if (name) { table.name=name; renderTablePlan(); }
}

function resizeTable(id) {
  const table = tpTables.find(t=>t.id===id);
  if (!table) return;
  const cap = parseInt(prompt('Number of seats:', table.capacity));
  if (!isNaN(cap) && cap>0) { table.capacity=cap; renderTablePlan(); }
}

function removeTable(id) {
  if (!confirm('Remove this table? Guests will be unassigned.')) return;
  tpTables = tpTables.filter(t=>t.id!==id);
  renderTablePlan();
}

function assignGuestToTable(tableId, guestId) {
  if (!guestId || !tableId) return;
  // Remove from any existing table
  tpTables.forEach(t => { t.guests=(t.guests||[]).filter(id=>id!==guestId); });
  const table = tpTables.find(t=>t.id===tableId);
  if (table) {
    if (!table.guests) table.guests=[];
    if ((table.guests||[]).length < (table.capacity||8)) table.guests.push(guestId);
  }
  renderTablePlan();
}

function removeGuestFromTable(tableId, guestId) {
  const table = tpTables.find(t=>t.id===tableId);
  if (table) table.guests=(table.guests||[]).filter(id=>id!==guestId);
  renderTablePlan();
}

}

  const budget     = bdData.data || [];

  // Guests
  const totalGuests    = guests.length;
  const confirmedGuests= guests.filter(g=>g.rsvp_status==='confirmed').length;
  const guestPct       = totalGuests ? Math.round(confirmedGuests/totalGuests*100) : 0;

  // Checklist
  const totalCl  = checklist.length;
  const doneCl   = checklist.filter(i=>i.status==='done').length;
  const clPct    = totalCl ? Math.round(doneCl/totalCl*100) : 0;

  // Run sheet
  const totalRs  = runsheet.length;
  const doneRs   = runsheet.filter(i=>i.done).length;
  const rsPct    = totalRs ? Math.round(doneRs/totalRs*100) : 0;

  // Budget
  const expenses  = budget.filter(i=>i.item_type!=='income');
  const totalActual = expenses.reduce((s,i)=>s+parseFloat(i.actual_amount||0),0);
  const totalPaid   = expenses.reduce((s,i)=>s+parseFloat(i.paid_amount||0),0);
  const budgetPct   = totalActual ? Math.round(totalPaid/totalActual*100) : 0;
  const totalIncome = budget.filter(i=>i.item_type==='income').reduce((s,i)=>s+parseFloat(i.actual_amount||0),0);

  // Table plan
  const totalSeats    = tpTables.reduce((s,t)=>s+(t.capacity||0),0);
  const assignedSeats = tpTables.reduce((s,t)=>s+(t.guests||[]).length,0);
  const seatsPct      = totalSeats ? Math.round(assignedSeats/totalSeats*100) : 0;

  // Rooms
  const totalRooms = currentEvent?.room_count || 0;

  const fmt = n => '€'+parseFloat(n||0).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:0});

  el.innerHTML = `
    <div class="ov-grid">
      <div class="ov-card" onclick="showTab('guests')">
        <div class="ov-card-label">👥 Guests attending</div>
        <div class="ov-card-value">${confirmedGuests}<span style="font-size:1rem;color:var(--ink3);font-weight:400;"> / ${totalGuests}</span></div>
        <div class="ov-card-sub">${guestPct}% confirmed</div>
        <div class="ov-progress"><div class="ov-progress-fill green" style="width:${guestPct}%"></div></div>
      </div>
      <div class="ov-card" onclick="showTab('checklist')">
        <div class="ov-card-label">✅ Checklist</div>
        <div class="ov-card-value">${doneCl}<span style="font-size:1rem;color:var(--ink3);font-weight:400;"> / ${totalCl}</span></div>
        <div class="ov-card-sub">${clPct}% complete</div>
        <div class="ov-progress"><div class="ov-progress-fill" style="width:${clPct}%"></div></div>
      </div>
      <div class="ov-card" onclick="showTab('budget')">
        <div class="ov-card-label">💰 Budget paid</div>
        <div class="ov-card-value">${fmt(totalPaid)}</div>
        <div class="ov-card-sub">${budgetPct}% of ${fmt(totalActual)} actual</div>
        <div class="ov-progress"><div class="ov-progress-fill" style="width:${Math.min(budgetPct,100)}%"></div></div>
      </div>
      <div class="ov-card" onclick="showTab('budget')">
        <div class="ov-card-label">📈 Income received</div>
        <div class="ov-card-value">${fmt(totalIncome)}</div>
        <div class="ov-card-sub">Total income logged</div>
      </div>
      <div class="ov-card" onclick="showTab('runsheet')">
        <div class="ov-card-label">📅 Run sheet</div>
        <div class="ov-card-value">${doneRs}<span style="font-size:1rem;color:var(--ink3);font-weight:400;"> / ${totalRs}</span></div>
        <div class="ov-card-sub">${rsPct}% complete</div>
        <div class="ov-progress"><div class="ov-progress-fill green" style="width:${rsPct}%"></div></div>
      </div>
      <div class="ov-card" onclick="showTab('tableplan')">
        <div class="ov-card-label">🪑 Seats assigned</div>
        <div class="ov-card-value">${assignedSeats}<span style="font-size:1rem;color:var(--ink3);font-weight:400;"> / ${totalSeats||'—'}</span></div>
        <div class="ov-card-sub">${totalSeats ? seatsPct+'% filled' : 'No tables set up yet'}</div>
        ${totalSeats ? `<div class="ov-progress"><div class="ov-progress-fill" style="width:${seatsPct}%"></div></div>` : ''}
      </div>
    </div>

    <div class="ov-section-title">⚡ Quick actions</div>
    <div class="ov-quick">
      <button class="quick-action" onclick="showTab('guests');openAddGuest()"><div class="quick-action-icon">👤</div>Add a guest</button>
      <button class="quick-action" onclick="showTab('checklist')"><div class="quick-action-icon">✅</div>View checklist</button>
      <button class="quick-action" onclick="showTab('budget');addBudgetRow()"><div class="quick-action-icon">💰</div>Log an expense</button>
      <button class="quick-action" onclick="showTab('runsheet');addRunsheetRow()"><div class="quick-action-icon">📅</div>Add run sheet item</button>
      <button class="quick-action" onclick="showTab('tableplan')"><div class="quick-action-icon">🪑</div>Table plan</button>
      <button class="quick-action" onclick="shareEvent()"><div class="quick-action-icon">🔗</div>Share with guests</button>
    </div>`;
}


async function initPage() {
  const ev = await loadEventHeader();
  if (ev) loadTablePlan();
}
</script>
</body>
</html>
