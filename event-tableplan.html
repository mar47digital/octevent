<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octevent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared.js"></script>
<script src="/header.js"></script>
</head>
<body>
<div id="app-header"></div>
<main>
<div class="panel-header">
  <div class="panel-header-left">
    <div class="panel-title">Table plan</div>
    <button class="btn" onclick="addTable('round')">+ Round table</button>
    <button class="btn" onclick="addTable('rect')">+ Rectangular table</button>
    <button class="btn amber" id="tp-save-btn" onclick="savePlan()">Save</button>
  </div>
  <div style="display:flex;gap:7px;">
    <button class="btn" onclick="exportCSV()">Export CSV</button>
    <button class="btn" onclick="printPlan()">Print</button>
  </div>
</div>
<div id="tp-summary" style="margin-bottom:1rem;font-size:0.83rem;color:var(--ink3);display:none;"></div>
<div id="tp-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;"></div>
<div id="tp-unassigned" style="margin-top:1.5rem;display:none;">
  <div style="font-size:0.72rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:0.75rem;">Unassigned guests</div>
  <div id="tp-unassigned-list" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
</div>
</main>

<script>

var tpTables=[], tpGuests=[];

async function init(){
  await OctHeader.init('tableplan');
  var res=await Promise.all([
    sb.from('events').select('table_plan').eq('id',eventId).single(),
    sb.from('guests').select('id,first_name,last_name,dietary').eq('event_id',eventId)
  ]);
  tpTables=Array.isArray(res[0].data&&res[0].data.table_plan)?res[0].data.table_plan:[];
  tpGuests=res[1].data||[];
  render();
}

function assignedIds(){var s=new Set();tpTables.forEach(function(t){(t.guests||[]).forEach(function(id){s.add(id);});});return s;}
function gName(id){var g=tpGuests.find(function(g){return g.id===id;});return g?(g.first_name+' '+(g.last_name||'')).trim():'?';}

function makeCard(t){
  var div=document.createElement('div');
  div.style.cssText='background:#fff;border:1px solid var(--rule);border-radius:14px;padding:1.1rem;';
  var ids=assignedIds();
  var assigned=t.guests||[],cap=t.capacity||8,remaining=cap-assigned.length;
  var unassigned=tpGuests.filter(function(g){return !ids.has(g.id);});

  var header=document.createElement('div');
  header.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;';
  header.innerHTML='<div><div style="font-family:Nunito,sans-serif;font-weight:800;font-size:1rem;">'+t.name+'</div><div style="font-size:0.7rem;color:var(--ink3);">'+(t.shape==='round'?'Round':'Rectangular')+' &middot; '+assigned.length+'/'+cap+' seats</div></div>';
  var btns=document.createElement('div');btns.style.display='flex';btns.style.gap='4px';
  var renBtn=document.createElement('button');renBtn.textContent='Rename';renBtn.style.cssText='font-size:0.68rem;padding:2px 8px;border-radius:5px;border:1px solid var(--rule);background:#fff;cursor:pointer;color:var(--ink2);';renBtn.onclick=function(){renameTable(t.id);};
  var remBtn=document.createElement('button');remBtn.textContent='Remove';remBtn.style.cssText='font-size:0.68rem;padding:2px 8px;border-radius:5px;border:1px solid #fdf0f0;background:#fff;cursor:pointer;color:var(--red);';remBtn.onclick=function(){removeTable(t.id);};
  btns.appendChild(renBtn);btns.appendChild(remBtn);header.appendChild(btns);div.appendChild(header);

  assigned.forEach(function(gid){
    var row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:var(--cream);border-radius:7px;font-size:0.81rem;margin-bottom:3px;';
    row.innerHTML='<span style="font-weight:500;">'+gName(gid)+'</span>';
    var x=document.createElement('button');x.innerHTML='&#x2715;';x.style.cssText='background:none;border:none;cursor:pointer;color:var(--ink3);font-size:0.9rem;';
    x.onclick=function(){removeGuest(t.id,gid);};
    row.appendChild(x);div.appendChild(row);
  });

  if(remaining>0){
    var sel=document.createElement('select');
    sel.style.cssText='width:100%;font-size:0.78rem;padding:5px 8px;border:1.5px dashed var(--rule);border-radius:7px;background:#fff;font-family:DM Sans,sans-serif;color:var(--ink3);cursor:pointer;outline:none;margin-top:4px;';
    sel.innerHTML='<option value="">+ Add guest ('+remaining+' seat'+(remaining!==1?'s':'')+' left)</option>';
    unassigned.forEach(function(g){var o=document.createElement('option');o.value=g.id;o.textContent=g.first_name+' '+(g.last_name||'');sel.appendChild(o);});
    sel.onchange=function(){if(sel.value)assignGuest(t.id,sel.value);sel.value='';};
    div.appendChild(sel);
  } else {
    var full=document.createElement('div');full.style.cssText='font-size:0.75rem;color:var(--ink3);text-align:center;padding:4px;margin-top:4px;';full.textContent='Table full';div.appendChild(full);
  }
  return div;
}

function render(){
  var grid=document.getElementById('tp-grid');
  var summary=document.getElementById('tp-summary');
  var uSection=document.getElementById('tp-unassigned');
  var uList=document.getElementById('tp-unassigned-list');
  var ids=assignedIds();
  var totalSeats=tpTables.reduce(function(s,t){return s+(t.capacity||0);},0);
  var assignedCount=tpTables.reduce(function(s,t){return s+(t.guests||[]).length;},0);
  if(summary){summary.style.display=tpTables.length?'block':'none';summary.textContent=tpTables.length+' tables &middot; '+assignedCount+' of '+tpGuests.length+' guests assigned &middot; '+(totalSeats-assignedCount)+' seats remaining';}
  grid.innerHTML='';
  if(!tpTables.length){grid.innerHTML='<div class="empty-state"><div class="icon">&#x1FA91;</div><h3>No tables yet</h3><p>Add a round or rectangular table to get started.</p></div>';}
  else{tpTables.forEach(function(t){grid.appendChild(makeCard(t));});}
  var unassigned=tpGuests.filter(function(g){return !ids.has(g.id);});
  if(uSection){uSection.style.display=(unassigned.length&&tpTables.length)?'block':'none';if(uList)uList.innerHTML=unassigned.map(function(g){return '<span style="font-size:0.78rem;padding:4px 10px;background:var(--cream);border:1px solid var(--rule);border-radius:20px;color:var(--ink2);">'+g.first_name+' '+(g.last_name||'')+'</span>';}).join('');}
}

function assignGuest(tableId,guestId){if(!guestId)return;tpTables.forEach(function(t){t.guests=(t.guests||[]).filter(function(id){return id!==guestId;});});var t=tpTables.find(function(t){return t.id===tableId;});if(t){if(!t.guests)t.guests=[];if(t.guests.length<(t.capacity||8))t.guests.push(guestId);}render();}
function removeGuest(tableId,guestId){var t=tpTables.find(function(t){return t.id===tableId;});if(t)t.guests=(t.guests||[]).filter(function(id){return id!==guestId;});render();}
function addTable(shape){var name=prompt('Table name:','Table '+(tpTables.length+1));if(!name)return;var cap=parseInt(prompt('Number of seats:',shape==='round'?'8':'10'))||8;tpTables.push({id:Date.now().toString(),name:name,shape:shape,capacity:cap,guests:[]});render();}
function renameTable(id){var t=tpTables.find(function(t){return t.id===id;});if(!t)return;var n=prompt('New name:',t.name);if(n){t.name=n;render();}}
function removeTable(id){if(!confirm('Remove table? Guests will be unassigned.'))return;tpTables=tpTables.filter(function(t){return t.id!==id;});render();}
async function savePlan(){var btn=document.getElementById('tp-save-btn');if(btn){btn.textContent='Saving...';btn.disabled=true;}await sb.from('events').update({table_plan:tpTables}).eq('id',eventId);if(btn){btn.textContent='Saved';btn.disabled=false;setTimeout(function(){btn.textContent='Save';},2000);}}
function exportCSV(){
  if(!tpTables.length){alert('No tables to export.');return;}
  var lines=['Table,Guest Name,Dietary'];
  tpTables.forEach(function(t){
    if(!(t.guests||[]).length){lines.push('"'+t.name+'","(empty)","" ');}
    else{(t.guests||[]).forEach(function(gid){var g=tpGuests.find(function(g){return g.id===gid;});if(g)lines.push('"'+t.name+'","'+g.first_name+' '+(g.last_name||'')+'","'+(g.dietary||'')+'"');});}
  });
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));
  a.download=(currentEvent?currentEvent.name:'event')+'-table-plan.csv';
  a.click();
}
function printPlan(){if(!tpTables.length){alert('No tables to print.');return;}var rows=tpTables.map(function(t){return '<div class="block"><div class="tname">'+t.name+'</div><div class="seats">'+(t.guests||[]).length+' of '+(t.capacity||8)+' seats</div>'+( !(t.guests||[]).length?'<div style="color:#ccc;font-style:italic;">Empty</div>':(t.guests||[]).map(function(gid){var g=tpGuests.find(function(g){return g.id===gid;});return g?'<div class="grow"><span>'+g.first_name+' '+(g.last_name||'')+'</span><span class="diet">'+(g.dietary||'')+'</span></div>':''}).join(''))+'</div>';}).join('');var html='<html><head><title>Table Plan</title><style>body{font-family:Arial,sans-serif;padding:2rem;}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;}.block{border:1px solid #eee;border-radius:7px;padding:0.9rem;break-inside:avoid;}.tname{font-weight:700;border-bottom:2px solid #F5A800;padding-bottom:0.35rem;margin-bottom:0.4rem;}.seats{font-size:0.7rem;color:#999;margin-bottom:0.4rem;}.grow{font-size:0.82rem;padding:0.28rem 0;border-bottom:1px solid #f5f5f5;display:flex;justify-content:space-between;}.diet{font-size:0.7rem;color:#999;}</style></head><body><h1>'+(currentEvent?currentEvent.name:'Event')+' — Table Plan</h1><div class="grid">'+rows+'</div></body></html>';var w=window.open('','_blank');w.document.write(html);w.document.close();w.print();}
init();

</script>
</body>
</html>
