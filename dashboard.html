<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --amber:#F5A800;
  --amber-light:#FFF8E6;
  --amber-dark:#C98A00;
  --ink:#18181A;
  --ink2:#555;
  --ink3:#999;
  --cream:#FAFAF7;
  --rule:#ECEAE4;
}
html,body{min-height:100%;background:var(--cream);}
body{font-family:'DM Sans',sans-serif;color:var(--ink);}

/* NAV */
nav{
  background:#fff;border-bottom:1px solid var(--rule);
  padding:0 2.5rem;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.nav-logo img{height:40px;width:auto;}
.nav-right{display:flex;align-items:center;gap:1rem;}
.nav-user{
  display:flex;align-items:center;gap:10px;
  font-size:0.85rem;color:var(--ink2);
}
.nav-avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--amber);display:flex;align-items:center;
  justify-content:center;font-size:0.8rem;font-weight:700;
  color:var(--ink);flex-shrink:0;
}
.sign-out-btn{
  font-size:0.78rem;color:var(--ink3);background:none;
  border:none;cursor:pointer;font-family:'DM Sans',sans-serif;
  padding:0.4rem 0.75rem;border-radius:100px;transition:all 0.2s;
}
.sign-out-btn:hover{background:var(--rule);color:var(--ink);}

/* MAIN */
main{max-width:1200px;margin:0 auto;padding:3rem 2.5rem;}

/* HEADER ROW */
.page-header{
  display:flex;align-items:center;
  justify-content:space-between;margin-bottom:2.5rem;
}
.page-header h1{
  font-family:'Nunito',sans-serif;
  font-size:2rem;font-weight:800;
}
.new-event-btn{
  display:flex;align-items:center;gap:8px;
  padding:0.75rem 1.5rem;background:var(--amber);
  color:var(--ink);border:none;border-radius:100px;
  font-family:'DM Sans',sans-serif;font-size:0.88rem;
  font-weight:600;cursor:pointer;transition:all 0.2s;
  text-decoration:none;
}
.new-event-btn:hover{background:var(--amber-dark);color:#fff;}
.new-event-btn svg{width:16px;height:16px;}

/* FILTER TABS */
.filter-tabs{
  display:flex;gap:8px;margin-bottom:2rem;
}
.filter-tab{
  padding:0.5rem 1.1rem;border-radius:100px;
  font-size:0.82rem;font-weight:500;cursor:pointer;
  border:1.5px solid var(--rule);background:#fff;
  color:var(--ink2);font-family:'DM Sans',sans-serif;
  transition:all 0.2s;
}
.filter-tab.active{
  background:var(--ink);color:#fff;border-color:var(--ink);
}
.filter-tab:hover:not(.active){border-color:var(--ink);}

/* EVENT GRID */
.events-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:20px;
}

/* EVENT CARD */





/* EMPTY STATE */
.empty-state{
  grid-column:1/-1;text-align:center;
  padding:5rem 2rem;
}

.empty-state p{font-size:0.9rem;color:var(--ink3);margin-bottom:1.5rem;font-weight:300;}

/* NEW EVENT MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  z-index:200;display:flex;align-items:center;
  justify-content:center;padding:1.5rem;
  opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:#fff;border-radius:20px;
  width:100%;max-width:520px;padding:2rem;
  transform:translateY(20px);transition:transform 0.2s;
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-header{
  display:flex;align-items:center;
  justify-content:space-between;margin-bottom:1.75rem;
}
.modal-title{font-family:'Nunito',sans-serif;font-size:1.3rem;font-weight:800;}
.modal-close{
  width:32px;height:32px;border-radius:50%;
  background:var(--cream);border:none;cursor:pointer;
  font-size:1.1rem;display:flex;align-items:center;
  justify-content:center;transition:background 0.2s;
}
.modal-close:hover{background:var(--rule);}
.field{margin-bottom:1rem;}
.field label{
  display:block;font-size:0.78rem;font-weight:500;
  color:var(--ink2);margin-bottom:0.4rem;
}
.field input,.field select,.field textarea{
  width:100%;padding:0.8rem 1rem;
  border:1.5px solid var(--rule);border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:0.88rem;
  color:var(--ink);background:#fff;outline:none;
  transition:border-color 0.2s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber);}
.field textarea{resize:vertical;min-height:80px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-footer{
  display:flex;gap:10px;justify-content:flex-end;
  margin-top:1.5rem;
}
.btn-cancel{
  padding:0.75rem 1.25rem;border-radius:100px;
  border:1.5px solid var(--rule);background:#fff;
  color:var(--ink2);font-family:'DM Sans',sans-serif;
  font-size:0.85rem;font-weight:500;cursor:pointer;
  transition:border-color 0.2s;
}
.btn-cancel:hover{border-color:var(--ink);}
.btn-create{
  padding:0.75rem 1.5rem;border-radius:100px;
  background:var(--amber);color:var(--ink);border:none;
  font-family:'DM Sans',sans-serif;font-size:0.85rem;
  font-weight:600;cursor:pointer;transition:all 0.2s;
}
.btn-create:hover{background:var(--amber-dark);color:#fff;}
.btn-create:disabled{opacity:0.6;cursor:not-allowed;}

/* LOADING */
.loading{
  grid-column:1/-1;display:flex;
  align-items:center;justify-content:center;
  padding:5rem;
}
.spinner{
  width:32px;height:32px;border:3px solid var(--rule);
  border-top-color:var(--amber);border-radius:50%;
  animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}


@media (max-width: 768px) {
  nav{padding:0 1.25rem;}
  .nav-logo img{height:32px;}
  .nav-user span{display:none;}
  main{padding:1.5rem 1.25rem;}
  .page-header{margin-bottom:1.25rem;}
  .page-header h1{font-size:1.4rem;}
  .new-event-btn{font-size:0.78rem;padding:0.6rem 1rem;}
  .filter-tabs{overflow-x:auto;padding-bottom:4px;flex-wrap:nowrap;}
  .filter-tab{white-space:nowrap;font-size:0.75rem;padding:0.4rem 0.85rem;}
  .events-grid{grid-template-columns:1fr;}
  .event-row-stats{display:none;}
  .event-row-thumb{width:72px;height:56px;}
  .modal{padding:1.25rem;}
  .field-row{grid-template-columns:1fr;}
  .modal-overlay{padding:1rem;}
}
@media (max-width: 480px) {
  .page-header{flex-direction:column;align-items:flex-start;gap:0.75rem;}
  .new-event-btn{width:100%;justify-content:center;}
}

.photo-upload{
  border:2px dashed var(--rule);border-radius:12px;
  height:140px;cursor:pointer;overflow:hidden;
  transition:border-color 0.2s;background:var(--cream);
}
.photo-upload:hover{border-color:var(--amber);}.photo-upload.dragover{border-color:var(--amber);background:var(--amber-light);}
.photo-upload-inner{width:100%;height:100%;position:relative;}
.photo-placeholder{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;gap:6px;
  color:var(--ink3);font-size:0.82rem;
}
.photo-placeholder svg{opacity:0.4;}
.photo-placeholder small{font-size:0.7rem;color:var(--ink3);opacity:0.7;}
</style>

<script>
const SUPABASE_URL = 'https://esjmzvhxbwcpslutprel.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzam16dmh4YndjcHNsdXRwcmVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzcxNjAsImV4cCI6MjA5Mzc1MzE2MH0.fsr1_P_ZB68SaiK00GPXvJLQUePM4eLght_CaAYOeF0';
const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let allEvents = [];
const gradients = ['gradient-1','gradient-2','gradient-3','gradient-4','gradient-5','gradient-6'];

// Auth check
sb.auth.getSession().then(({ data: { session } }) => {
  if (!session) { window.location.href = '/login'; return; }
  currentUser = session.user;
  const name = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
  const unEl = document.getElementById('user-name');
  const avEl = document.getElementById('user-avatar');
  if (unEl) unEl.textContent = name;
  if (avEl) avEl.textContent = name.charAt(0).toUpperCase();
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const greetName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
  const greetEl = document.getElementById('dashboard-greeting');
  if (greetEl) greetEl.textContent = greet + ', ' + greetName + '.';
  loadEvents();
});

async function loadEvents() {
  const { data, error } = await sb
    .from('events')
    .select('*')
    .order('event_date', { ascending: true });

  if (error) {
    console.error(error);
    renderEvents([]);
    return;
  }
  allEvents = data || [];
  renderEvents(allEvents);
}

function getStatus(event) {
  if (event.status === 'draft') return 'draft';
  const today = new Date();
  const date  = new Date(event.event_date);
  const diff  = (date - today) / (1000 * 60 * 60 * 24);
  if (diff < -1) return 'past';
  if (diff <= 1) return 'live';
  return 'upcoming';
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  return new Date(dateStr).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}

function renderEvents(events) {
  const grid = document.getElementById('events-grid');
  if (!events.length) {
    grid.innerHTML = `<div style="text-align:center;padding:4rem 2rem;background:#fff;border:1px solid var(--rule);border-radius:12px;">
      <div style="font-family:'Nunito',sans-serif;font-size:1.3rem;font-weight:800;margin-bottom:0.5rem;">No events yet</div>
      <p style="font-size:0.85rem;color:var(--ink3);margin-bottom:1.5rem;font-weight:300;">Create your first event and start planning.</p>
      <button class="new-event-btn" onclick="openModal()" style="margin:0 auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg>
        Create first event
      </button></div>`;
    return;
  }
  const STATUS_STYLE = {
    upcoming:'background:#FFF8E6;color:#C98A00;',
    live:'background:#f0f7f4;color:#2d6a4f;',
    past:'background:#f0f0f0;color:#666;',
    draft:'background:#f0f0f0;color:#999;',
  };
  grid.innerHTML = events.map((ev, i) => {
    const status = getStatus(ev);
    const grad = gradients[i % gradients.length];
    const thumb = ev.cover_image
      ? `<img src="${ev.cover_image}" alt="${ev.name}">`
      : `<div style="width:100%;height:100%;background:${['linear-gradient(135deg,#1a1a2e,#533483)','linear-gradient(135deg,#0f3460,#e94560)','linear-gradient(135deg,#2d6a4f,#40916c)','linear-gradient(135deg,#c98a00,#f5a800)','linear-gradient(135deg,#3d405b,#81b29a)','linear-gradient(135deg,#582c4d,#c9a227)'][i%6]};"></div>`;
    const meta = [];
    if (ev.event_date) meta.push(formatDate(ev.event_date));
    const loc = [ev.venue, ev.city, ev.country].filter(Boolean).join(', ');
    if (loc) meta.push(loc);
    if (ev.event_type) meta.push(ev.event_type.charAt(0).toUpperCase()+ev.event_type.slice(1));
    return `<a class="event-row" href="/event-overview?id=${ev.id}">
      <div class="event-row-thumb">${thumb}</div>
      <div style="flex:1;display:flex;align-items:center;padding:0 1.25rem;gap:1rem;min-width:0;">
        <div style="flex:1;min-width:0;">
          <div style="font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;">${ev.name}</div>
          <div style="font-size:0.76rem;color:var(--ink3);">${meta.join(' &middot; ')}</div>
        </div>
        <div class="event-row-stats" style="display:flex;gap:1.5rem;flex-shrink:0;">
          <div style="text-align:center;"><div style="font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:800;">${ev.guest_count||0}</div><div style="font-size:0.6rem;color:var(--ink3);text-transform:uppercase;letter-spacing:0.06em;">Guests</div></div>
          <div style="text-align:center;"><div style="font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:800;">${ev.room_count||0}</div><div style="font-size:0.6rem;color:var(--ink3);text-transform:uppercase;letter-spacing:0.06em;">Rooms</div></div>
          <div style="text-align:center;"><div style="font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:800;">${ev.rsvp_count||0}</div><div style="font-size:0.6rem;color:var(--ink3);text-transform:uppercase;letter-spacing:0.06em;">RSVPs</div></div>
        </div>
        <div style="flex-shrink:0;"><span style="font-size:0.6rem;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:2px 8px;border-radius:100px;${STATUS_STYLE[status]}">${status}</span></div>
      </div>
    </a>`;
  }).join('');
}

function getStatus(event) {
  if (event.status === 'draft') return 'draft';
  const today = new Date();
  const date  = new Date(event.event_date);
  const diff  = (date - today) / (1000 * 60 * 60 * 24);
  if (diff < -1) return 'past';
  if (diff <= 1) return 'live';
  return 'upcoming';
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  return new Date(dateStr).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}
