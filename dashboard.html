<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octevent — My events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared.js"></script>
<style>
.event-list{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--white);}
.event-row{display:flex;align-items:center;gap:1.1rem;padding:0.9rem 1.1rem;text-decoration:none;border-bottom:1px solid var(--rule);transition:background 0.15s;}
.event-row:last-child{border-bottom:none;}
.event-row:hover{background:#faf8ff;}
.thumb{width:84px;height:60px;border-radius:8px;flex-shrink:0;background:var(--purple-light);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--purple);}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb svg{width:22px;height:22px;opacity:0.7;}
.row-main{flex:1;min-width:0;}
.row-name{font-weight:700;font-size:0.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-meta{font-size:0.8rem;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-stats{display:flex;gap:1.5rem;flex-shrink:0;}
.stat{text-align:center;min-width:44px;}
.stat-n{font-weight:800;font-size:1rem;line-height:1.1;}
.stat-l{font-size:0.62rem;color:var(--ink3);text-transform:uppercase;letter-spacing:0.06em;}
.row-badge{flex-shrink:0;width:90px;text-align:right;}
@media (max-width:640px){
  .row-stats{display:none;}
  .row-badge{width:auto;}
  .thumb{width:64px;height:48px;}
}
</style>
</head>
<body>
<main class="main">
  <div class="content">
    <div class="page-head">
      <div>
        <h1 id="greeting">My events</h1>
        <div class="page-sub">Your events, soonest first.</div>
      </div>
      <button class="btn btn-primary" onclick="openNew()"><span style="display:flex" id="plus-ic"></span>New event</button>
    </div>
    <div id="list"><div class="spinner"></div></div>
  </div>
</main>

<!-- NEW EVENT MODAL -->
<div class="modal-wrap" id="new-modal">
  <div class="modal">
    <div class="modal-head">
      <h2>New event</h2>
      <button class="modal-close" onclick="closeNew()" aria-label="Close" id="close-ic"></button>
    </div>
    <div class="notice notice-error" id="new-error" style="display:none"></div>
    <div class="field">
      <label for="n-name">Event name</label>
      <input class="input" id="n-name" placeholder="e.g. Sunrise Yoga Retreat, Mallorca">
    </div>
    <div class="field">
      <label for="n-type">Type of event</label>
      <select class="input" id="n-type"></select>
    </div>
    <div class="grid-2">
      <div class="field"><label for="n-start">Start date</label><input class="input" type="date" id="n-start"></div>
      <div class="field"><label for="n-end">End date</label><input class="input" type="date" id="n-end"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeNew()">Cancel</button>
      <button class="btn btn-primary" id="create-btn" onclick="createNewEvent()">Create event</button>
    </div>
  </div>
</div>

<script>
let user;

(async function init() {
  user = await requireUser();
  if (!user) return;
  Layout.render('events', user, null);
  document.getElementById('plus-ic').innerHTML = ICON.plus;
  document.getElementById('close-ic').innerHTML = ICON.close;
  document.getElementById('n-type').innerHTML = Object.entries(EVENT_TYPES)
    .map(([k, v]) => '<option value="' + k + '">' + v + '</option>').join('');

  const hour = new Date().getHours();
  const hello = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greeting').textContent = hello + ', ' + userName(user).split(' ')[0];

  loadEvents();
})();

async function loadEvents() {
  const { data, error } = await sb.from('events')
    .select('id,name,event_type,start_date,end_date,venue_name,location,cover_image_url,guest_site_live,rooms(count),bookings(count)')
    .order('start_date', { ascending: true, nullsFirst: false })
    .order('created_at', { ascending: false });

  const list = document.getElementById('list');
  if (error) { list.innerHTML = '<div class="notice notice-error">Could not load your events: ' + esc(error.message) + '</div>'; return; }
  if (!data.length) {
    list.innerHTML = '<div class="empty">' + ICON.events +
      '<h3>No events yet</h3><p>Create your first event, add its rooms, and you\'ll soon be able to share a booking page with your guests.</p>' +
      '<button class="btn btn-primary" onclick="openNew()">' + ICON.plus + 'Create your first event</button></div>';
    return;
  }

  list.innerHTML = '<div class="event-list">' + data.map(ev => {
    const rooms = ev.rooms && ev.rooms[0] ? ev.rooms[0].count : 0;
    const booked = ev.bookings && ev.bookings[0] ? ev.bookings[0].count : 0;
    const days = daysUntil(ev.end_date || ev.start_date);
    let badge;
    if (days !== null && days < 0) badge = '<span class="badge badge-grey">Past</span>';
    else if (ev.guest_site_live) badge = '<span class="badge badge-green">Live</span>';
    else badge = '<span class="badge badge-purple">Draft</span>';
    const meta = [EVENT_TYPES[ev.event_type] || '', fmtDateRange(ev.start_date, ev.end_date), ev.venue_name || ev.location || '']
      .filter(Boolean).join(' · ');
    return '<a class="event-row" href="/event-details?id=' + ev.id + '">' +
      '<div class="thumb">' + (ev.cover_image_url ? '<img src="' + esc(ev.cover_image_url) + '" alt="">' : ICON.image) + '</div>' +
      '<div class="row-main"><div class="row-name">' + esc(ev.name) + '</div><div class="row-meta">' + esc(meta) + '</div></div>' +
      '<div class="row-stats"><div class="stat"><div class="stat-n">' + rooms + '</div><div class="stat-l">Rooms</div></div>' +
      '<div class="stat"><div class="stat-n">' + booked + '</div><div class="stat-l">Bookings</div></div></div>' +
      '<div class="row-badge">' + badge + '</div></a>';
  }).join('') + '</div>';
}

function openNew() {
  document.getElementById('new-error').style.display = 'none';
  document.getElementById('new-modal').classList.add('open');
  setTimeout(() => document.getElementById('n-name').focus(), 50);
}
function closeNew() { document.getElementById('new-modal').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNew(); });

async function createNewEvent() {
  const name = document.getElementById('n-name').value.trim();
  const start = document.getElementById('n-start').value || null;
  const end = document.getElementById('n-end').value || null;
  const errEl = document.getElementById('new-error');
  const fail = msg => { errEl.textContent = msg; errEl.style.display = 'block'; };

  if (!name) return fail('Please give your event a name.');
  if (start && end && end < start) return fail('The end date is before the start date.');

  const btn = document.getElementById('create-btn');
  btn.disabled = true; btn.textContent = 'Creating...';
  const { data, error } = await sb.from('events')
    .insert({ name, event_type: document.getElementById('n-type').value, start_date: start, end_date: end || start })
    .select('id').single();
  if (error) {
    btn.disabled = false; btn.textContent = 'Create event';
    return fail('Could not create the event: ' + error.message);
  }
  location.href = '/event-details?id=' + data.id + '&new=1';
}
</script>
</body>
</html>
