<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octevent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared.js"></script>
<script src="/header.js"></script>
</head>
<body>
<div id="app-header"></div>
<main>
<div style="max-width:540px;">
  <div class="panel-title" style="margin-bottom:1.25rem;">Event settings</div>
  <div style="background:#fff;border:1px solid var(--rule);border-radius:14px;padding:1.5rem;">
    <div class="field">
      <label>Cover photo</label>
      <div id="photo-area" onclick="document.getElementById('photo-input').click()" style="border:2px dashed var(--rule);border-radius:10px;height:140px;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--cream);transition:border-color 0.2s;" onmouseover="this.style.borderColor='var(--amber)'" onmouseout="this.style.borderColor='var(--rule)'">
        <div id="photo-placeholder" style="text-align:center;color:var(--ink3);font-size:0.82rem;"><div style="font-size:1.5rem;margin-bottom:0.4rem;">&#x1F4F7;</div><div>Click to upload cover photo</div><div style="font-size:0.72rem;margin-top:2px;opacity:0.7;">JPG or PNG, max 5MB</div></div>
        <img id="photo-preview" style="display:none;width:100%;height:100%;object-fit:cover;" alt="">
      </div>
      <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="previewPhoto(event)">
    </div>
    <div class="field"><label>Event name *</label><input type="text" id="s-name"></div>
    <div class="field-row">
      <div class="field"><label>Start date</label><input type="date" id="s-date"></div>
      <div class="field"><label>End date</label><input type="date" id="s-end"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Event type</label><select id="s-type"><option value="wedding">Wedding</option><option value="corporate">Corporate</option><option value="retreat">Retreat</option><option value="party">Private party</option><option value="villa">Villa event</option><option value="other">Other</option></select></div>
      <div class="field"><label>Venue</label><input type="text" id="s-venue"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="s-notes"></textarea></div>
    <div style="display:flex;gap:9px;align-items:center;margin-top:0.5rem;">
      <button class="btn-primary" onclick="saveSettings()">Save changes</button>
      <button class="btn danger" onclick="deleteEvent()">Delete event</button>
      <span id="s-msg" style="font-size:0.8rem;display:none;"></span>
    </div>
  </div>
</div>
</main>

<script>

async function init(){
  var ev=await OctHeader.init('settings');
  if(!ev)return;
  document.getElementById('s-name').value=ev.name||'';
  document.getElementById('s-date').value=ev.event_date||'';
  document.getElementById('s-end').value=ev.end_date||'';
  document.getElementById('s-type').value=ev.event_type||'other';
  document.getElementById('s-venue').value=ev.venue||'';
  document.getElementById('s-notes').value=ev.notes||'';
  if(ev.cover_image){document.getElementById('photo-preview').src=ev.cover_image;document.getElementById('photo-preview').style.display='block';document.getElementById('photo-placeholder').style.display='none';}
}
function previewPhoto(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){document.getElementById('photo-preview').src=ev.target.result;document.getElementById('photo-preview').style.display='block';document.getElementById('photo-placeholder').style.display='none';};r.readAsDataURL(f);}
async function saveSettings(){
  var btn=document.querySelector('.btn-primary'),msg=document.getElementById('s-msg');
  btn.textContent='Saving...';btn.disabled=true;
  var cover_image=null;
  var photoFile=document.getElementById('photo-input').files[0];
  if(photoFile){var s=await sb.auth.getSession();var ext=photoFile.name.split('.').pop();var path=s.data.session.user.id+'/'+Date.now()+'.'+ext;var up=await sb.storage.from('event-covers').upload(path,photoFile,{cacheControl:'3600',upsert:false});if(!up.error){var ud=sb.storage.from('event-covers').getPublicUrl(path);cover_image=ud.data.publicUrl;}}
  var updates={name:document.getElementById('s-name').value.trim(),event_date:document.getElementById('s-date').value||null,end_date:document.getElementById('s-end').value||null,event_type:document.getElementById('s-type').value,venue:document.getElementById('s-venue').value.trim(),notes:document.getElementById('s-notes').value.trim()};
  if(cover_image)updates.cover_image=cover_image;
  var res=await sb.from('events').update(updates).eq('id',eventId);
  btn.textContent='Save changes';btn.disabled=false;
  if(!res.error){Object.assign(currentEvent,updates);OctHeader.load();msg.textContent='Saved';msg.style.color='var(--green)';msg.style.display='inline';setTimeout(function(){msg.style.display='none';},2500);}
  else{msg.textContent='Error saving.';msg.style.color='var(--red)';msg.style.display='inline';}
}
async function deleteEvent(){if(!confirm('Delete this event? This cannot be undone.'))return;await sb.from('events').delete().eq('id',eventId);location.href='/dashboard';}
init();

</script>
</body>
</html>
