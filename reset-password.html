<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octevent — Set a new password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared.js"></script>
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem;}
.box{width:100%;max-width:400px;}
.box img{height:30px;width:auto;margin-bottom:2rem;}
.box h1{font-size:1.5rem;font-weight:800;margin-bottom:0.3rem;}
.box p{font-size:0.86rem;color:var(--ink3);margin-bottom:1.5rem;}
.box .btn{width:100%;padding:0.8rem;}
</style>
</head>
<body>
<div class="box">
  <img src="/octevent-logo.png" alt="Octevent">
  <h1>Set a new password</h1>
  <p>Choose a new password for your Octevent account.</p>
  <div class="notice notice-error" id="err" style="display:none"></div>
  <div class="notice notice-ok" id="ok" style="display:none"></div>
  <div id="form">
    <div class="field"><label for="pw">New password</label><input class="input" type="password" id="pw" placeholder="At least 8 characters"></div>
    <div class="field"><label for="pw2">Type it again</label><input class="input" type="password" id="pw2"></div>
    <button class="btn btn-primary" id="btn" onclick="setPassword()" style="margin-top:0.5rem">Save new password</button>
  </div>
</div>
<script>
function show(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.style.display = 'block'; }

async function setPassword() {
  document.getElementById('err').style.display = 'none';
  const pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
  if (pw.length < 8) return show('err', 'Password must be at least 8 characters.');
  if (pw !== pw2) return show('err', 'The two passwords don\'t match.');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return show('err', 'This reset link has expired. Go back to the sign-in page and request a new one.');
  const btn = document.getElementById('btn'); btn.disabled = true; btn.textContent = 'Saving...';
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) { btn.disabled = false; btn.textContent = 'Save new password'; return show('err', error.message); }
  document.getElementById('form').style.display = 'none';
  show('ok', 'Password updated. Taking you to your events...');
  setTimeout(() => location.href = '/dashboard', 1500);
}
</script>
</body>
</html>
