<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octevent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared.js"></script>
<script src="/header.js"></script>
</head>
<body>
<div id="app-header"></div>
<main>
<div class="panel-header">
  <div class="panel-header-left">
    <div class="panel-title">Budget</div>
    <button class="btn" onclick="addRow('income')">+ Income</button>
    <button class="btn" onclick="addRow('expense')">+ Expense</button>
    <button class="btn amber" id="save-order-btn" onclick="saveOrder()" style="display:none;">Save order</button>
  </div>
</div>
<div class="summary-cards">
  <div class="s-card"><div class="s-card-label">Total income</div><div class="s-card-value green" id="b-income">0</div></div>
  <div class="s-card"><div class="s-card-label">Total expenses</div><div class="s-card-value" id="b-expenses">0</div></div>
  <div class="s-card"><div class="s-card-label">Total paid out</div><div class="s-card-value" id="b-paid">0</div></div>
  <div class="s-card"><div class="s-card-label">Total deposits</div><div class="s-card-value amber" id="b-deposits">0</div></div>
  <div class="s-card"><div class="s-card-label" id="b-net-label">Net surplus</div><div class="s-card-value green" id="b-net">0</div></div>
</div>
<div id="b-content"><div class="spinner"></div></div>
</main>

<script>

var allItems=[];
var EXP_CATS=['accommodation','catering','decor','flowers','music','other','photography','staffing','transport','venue'];
var INC_CATS=['client_payment','other_income','room_rental','sponsorship','ticket_sales'];
var CAT_LABELS={accommodation:'Accommodation',catering:'Catering',decor:'Decor',flowers:'Flowers',music:'Music',other:'Other',photography:'Photography',staffing:'Staffing',transport:'Transport',venue:'Venue',client_payment:'Client payment',other_income:'Other income',room_rental:'Room rental',sponsorship:'Sponsorship',ticket_sales:'Ticket sales'};
var CAT_STYLES={accommodation:'background:#fff8e6;color:#c98a00;',catering:'background:#fdf6ec;color:#92600a;',decor:'background:#fdf5f0;color:#a04a1a;',flowers:'background:#fdf0f7;color:#8b2a6e;',music:'background:#f0f0fd;color:#4a4aab;',other:'background:var(--rule);color:var(--ink3);',photography:'background:#f0f7f4;color:var(--green);',staffing:'background:#f5f0fd;color:#6b3fa0;',transport:'background:#fdf0f0;color:var(--red);',venue:'background:#e8f4fd;color:#1a6fa8;',client_payment:'background:#fde8f7;color:#a81a7a;',other_income:'background:#f7f0e8;color:#7a4a1a;',room_rental:'background:#e8f7f0;color:#1a7a4a;',sponsorship:'background:#f0fde8;color:#3a7a1a;',ticket_sales:'background:#e8f0fd;color:#1a3fa8;'};

async function init(){
  await OctHeader.init('budget');
  var res=await sb.from('budget_items').select('*').eq('event_id',eventId).order('sort_order',{ascending:true}).order('created_at',{ascending:true});
  allItems=res.data||[];
  render();
}

function updateSummary(){
  var inc=allItems.filter(function(i){return i.item_type==='income';});
  var exp=allItems.filter(function(i){return i.item_type!=='income';});
  var incAmt=inc.reduce(function(s,i){return s+parseFloat(i.actual_amount||0);},0);
  var expFinal=exp.reduce(function(s,i){return s+parseFloat(i.actual_amount||0);},0);
  var expPaid=exp.reduce(function(s,i){return s+parseFloat(i.paid_amount||0);},0);
  var expDep=exp.reduce(function(s,i){return s+parseFloat(i.deposit_amount||0);},0);
  var net=incAmt-expFinal;
  document.getElementById('b-income').textContent=fmtSum(incAmt);
  document.getElementById('b-expenses').textContent=fmtSum(expFinal);
  document.getElementById('b-paid').textContent=fmtSum(expPaid);
  document.getElementById('b-deposits').textContent=fmtSum(expDep);
  document.getElementById('b-net').textContent=fmtSum(Math.abs(net));
  document.getElementById('b-net').className='s-card-value '+(net>=0?'green':'red');
  document.getElementById('b-net-label').textContent=net>=0?'Net surplus':'Outstanding balance';
}

function calcTotal(item){
  var q=parseFloat(item.quantity||0),h=parseFloat(item.hours||0),c=parseFloat(item.cost_pp||0);
  return h>0?q*h*c:q>0?q*c:c;
}

function buildRow(item){
  var tr=document.createElement('tr');
  tr.dataset.id=item.id;
  var isInc=item.item_type==='income';
  var calc=calcTotal(item);
  var rem=parseFloat(item.actual_amount||0)-parseFloat(item.paid_amount||0);
  var gi=allItems.indexOf(item);

  function cell(field,type,cls){
    var td=document.createElement('td');
    if(cls)td.className=cls;
    renderCell(td,item,field,type);
    if(type!=='calc'&&type!=='rem'&&type!=='move'){
      td.style.cursor='pointer';
      td.addEventListener('click',function(){editCell(td,item,field,type);});
    }
    return td;
  }

  // Move arrows
  var moveTd=document.createElement('td');
  moveTd.style.whiteSpace='nowrap';
  moveTd.style.width='44px';
  if(gi>0){var up=document.createElement('button');up.textContent='▲';up.style.cssText='background:none;border:none;cursor:pointer;color:var(--ink3);padding:1px 3px;font-size:0.8rem;';up.onclick=function(){moveRow(item.id,-1);};moveTd.appendChild(up);}
  if(gi<allItems.length-1){var dn=document.createElement('button');dn.textContent='▼';dn.style.cssText='background:none;border:none;cursor:pointer;color:var(--ink3);padding:1px 3px;font-size:0.8rem;';dn.onclick=function(){moveRow(item.id,1);};moveTd.appendChild(dn);}
  tr.appendChild(moveTd);

  tr.appendChild(cell('item_type','type'));
  tr.appendChild(cell('category','cat'));
  tr.appendChild(cell('supplier','text'));
  tr.appendChild(cell('description','text'));
  tr.appendChild(cell('quantity','num','num'));
  tr.appendChild(cell('hours','num','num'));
  tr.appendChild(cell('cost_pp','num','num'));
  var calcTd=document.createElement('td');calcTd.className='num';calcTd.style.color='var(--ink3)';calcTd.textContent=calc>0?fmtEuro(calc):'—';tr.appendChild(calcTd);
  tr.appendChild(cell('allocated_budget','num','num'));
  tr.appendChild(cell('actual_amount','num','num'));
  tr.appendChild(cell('deposit_amount','num','num'));
  tr.appendChild(cell('paid_amount','num','num'));
  var remTd=document.createElement('td');remTd.className='num';
  if(isInc){remTd.innerHTML=rem<=0?'<span style="color:var(--green);">&#x2713; Received</span>':'<span style="color:var(--green);font-weight:700;">'+fmtEuro(rem)+'</span>';}
  else{remTd.innerHTML=rem<=0?'<span style="color:var(--green);">&#x2713; Clear</span>':'<span style="color:var(--red);font-weight:700;">'+fmtEuro(rem)+'</span>';}
  tr.appendChild(remTd);
  tr.appendChild(cell('next_payment_date','date'));
  tr.appendChild(cell('notes','text'));
  var delTd=document.createElement('td');var delBtn=document.createElement('button');delBtn.className='row-del';delBtn.textContent='Delete';delBtn.onclick=function(){deleteItem(item.id);};delTd.appendChild(delBtn);tr.appendChild(delTd);
  return tr;
}

function renderCell(td,item,field,type){
  if(type==='type'){var isInc=item[field]==='income';td.innerHTML='<span class="badge" style="'+(isInc?'background:#f0f7f4;color:var(--green);':'background:#fdf0f0;color:var(--red);')+'">'+(isInc?'Income':'Expense')+'</span>';}
  else if(type==='cat'){td.innerHTML='<span class="badge" style="'+(CAT_STYLES[item[field]]||CAT_STYLES.other)+'">'+CAT_LABELS[item[field]]+'</span>';}
  else if(type==='num'){td.textContent=fmtEuro(item[field]);}
  else if(type==='date'){td.textContent=fmtDate(item[field]);td.style.fontSize='0.78rem';}
  else{td.textContent=item[field]||'—';if(field==='notes')td.style.cssText='font-size:0.78rem;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';}
}

function editCell(td,item,field,type){
  if(td.classList.contains('editing'))return;
  td.classList.add('editing');
  var input;
  if(type==='type'){input=document.createElement('select');input.className='inline-select';[['income','Income'],['expense','Expense']].forEach(function(v){var o=document.createElement('option');o.value=v[0];o.textContent=v[1];if(v[0]===item[field])o.selected=true;input.appendChild(o);});}
  else if(type==='cat'){input=document.createElement('select');input.className='inline-select';var cats=item.item_type==='income'?INC_CATS:EXP_CATS;cats.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=CAT_LABELS[v];if(v===item[field])o.selected=true;input.appendChild(o);});}
  else{input=document.createElement('input');input.className='inline-input';input.type=type==='num'?'number':type==='date'?'date':'text';input.value=item[field]||'';if(type==='num'){input.step='0.01';input.min='0';}}
  td.innerHTML='';td.appendChild(input);input.focus();if(input.select)input.select();
  var saved=false;
  function save(){if(saved)return;saved=true;var val=type==='num'?parseFloat(input.value)||0:type==='date'?input.value||null:input.value.trim();item[field]=val;td.classList.remove('editing');render();sb.from('budget_items').update({[field]:val}).eq('id',item.id);}
  input.addEventListener('blur',save);
  input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();input.blur();}if(e.key==='Escape'){saved=true;td.classList.remove('editing');renderCell(td,item,field,type);}});
}

function render(){
  updateSummary();
  var el=document.getElementById('b-content');
  var inc=allItems.filter(function(i){return i.item_type==='income';});
  var exp=allItems.filter(function(i){return i.item_type!=='income';});
  if(!allItems.length){el.innerHTML='<div class="empty-state"><div class="icon">&#x1F4B0;</div><h3>No budget items yet</h3><p>Click + Income or + Expense to get started.</p></div>';return;}

  var wrap=document.createElement('div');wrap.className='table-wrap table-scroll';
  var tbl=document.createElement('table');
  tbl.innerHTML='<thead><tr><th style="width:44px;"></th><th>Type</th><th>Category</th><th>Supplier</th><th>Description</th><th class="num">Qty</th><th class="num">Hrs</th><th class="num">Cost/unit</th><th class="num">=Total</th><th class="num">Allocated</th><th class="num">Final</th><th class="num">Deposit</th><th class="num">Paid</th><th class="num">Remaining</th><th>Next payment</th><th>Notes</th><th></th></tr></thead>';
  var tbody=document.createElement('tbody');

  function secHeader(label){var tr=document.createElement('tr');tr.innerHTML='<td colspan="17" style="background:var(--cream);font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink3);padding:0.5rem 0.8rem;border-top:2px solid var(--rule);">'+label+'</td>';return tr;}
  function totRow(items,cls){
    var alloc=items.reduce(function(s,i){return s+parseFloat(i.allocated_budget||0);},0);
    var final=items.reduce(function(s,i){return s+parseFloat(i.actual_amount||0);},0);
    var dep=items.reduce(function(s,i){return s+parseFloat(i.deposit_amount||0);},0);
    var paid=items.reduce(function(s,i){return s+parseFloat(i.paid_amount||0);},0);
    var rem=final-paid;
    var tr=document.createElement('tr');tr.style.background=cls;tr.style.borderTop='2px solid var(--rule)';
    tr.innerHTML='<td colspan="9"></td><td class="num"><strong>'+fmtSum(alloc)+'</strong></td><td class="num"><strong>'+fmtSum(final)+'</strong></td><td class="num"><strong>'+fmtSum(dep)+'</strong></td><td class="num"><strong>'+fmtSum(paid)+'</strong></td><td class="num '+(rem>0?'red':'green')+'"><strong>'+fmtSum(rem)+'</strong></td><td colspan="3"></td>';
    return tr;
  }

  if(inc.length){tbody.appendChild(secHeader('Income'));inc.forEach(function(item){tbody.appendChild(buildRow(item));});tbody.appendChild(totRow(inc,'#f0f7f4'));}
  if(exp.length){tbody.appendChild(secHeader('Expenses'));exp.forEach(function(item){tbody.appendChild(buildRow(item));});tbody.appendChild(totRow(exp,'var(--cream)'));}

  var net=inc.reduce(function(s,i){return s+parseFloat(i.actual_amount||0);},0)-exp.reduce(function(s,i){return s+parseFloat(i.actual_amount||0);},0);
  var netRow=document.createElement('tr');netRow.style.cssText='background:#f9f9f7;border-top:2px solid var(--rule);';
  netRow.innerHTML='<td colspan="9"><strong>'+(net>=0?'Net surplus':'Outstanding balance')+'</strong></td><td class="num '+(net>=0?'green':'red')+'" colspan="4"><strong style="font-size:1rem;">'+fmtSum(Math.abs(net))+'</strong></td><td colspan="4"></td>';
  tbody.appendChild(netRow);

  tbl.appendChild(tbody);wrap.appendChild(tbl);
  el.innerHTML='';el.appendChild(wrap);
}

function moveRow(id,dir){var idx=allItems.findIndex(function(i){return i.id===id;});var ni=idx+dir;if(ni<0||ni>=allItems.length)return;var m=allItems.splice(idx,1)[0];allItems.splice(ni,0,m);render();document.getElementById('save-order-btn').style.display='inline-flex';}
async function saveOrder(){var btn=document.getElementById('save-order-btn');btn.textContent='Saving...';btn.disabled=true;await Promise.all(allItems.map(function(item,idx){return sb.from('budget_items').update({sort_order:idx}).eq('id',item.id);}));btn.textContent='Saved';btn.disabled=false;setTimeout(function(){btn.textContent='Save order';btn.style.display='none';},2000);}
async function addRow(type){var res=await sb.from('budget_items').insert([{event_id:eventId,item_type:type,category:type==='income'?'other_income':'other',supplier:'',description:'',quantity:0,hours:0,cost_pp:0,allocated_budget:0,actual_amount:0,deposit_amount:0,paid_amount:0,next_payment_date:null,notes:'',sort_order:allItems.length}]).select().single();if(!res.error&&res.data){allItems.push(res.data);render();setTimeout(function(){var r=document.querySelector('tr[data-id="'+res.data.id+'"]');if(r){r.scrollIntoView({behavior:'smooth',block:'center'});}},80);}}
async function deleteItem(id){if(!confirm('Delete this item?'))return;await sb.from('budget_items').delete().eq('id',id);allItems=allItems.filter(function(i){return i.id!==id;});render();}
init();

</script>
</body>
</html>
