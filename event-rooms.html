<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octevent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared.js"></script>
<script src="/header.js"></script>
</head>
<body>
<div id="app-header"></div>
<main>
<div class="panel-header">
  <div class="panel-header-left">
    <div class="panel-title">Rooms</div>
    <button class="btn amber" onclick="addRoom()">+ Add room</button>
  </div>
</div>
<div class="summary-cards" id="r-summary" style="display:none;">
  <div class="s-card"><div class="s-card-label">Total rooms</div><div class="s-card-value" id="r-total">0</div></div>
  <div class="s-card"><div class="s-card-label">Available</div><div class="s-card-value green" id="r-avail">0</div></div>
  <div class="s-card"><div class="s-card-label">Reserved</div><div class="s-card-value amber" id="r-res">0</div></div>
  <div class="s-card"><div class="s-card-label">Total capacity</div><div class="s-card-value" id="r-cap">0</div></div>
  <div class="s-card"><div class="s-card-label">Expected income</div><div class="s-card-value green" id="r-inc">0</div></div>
</div>
<div id="r-content"><div class="spinner"></div></div>
</main>

<script>

var allRooms=[], allGuests=[];
var ROOM_TYPES={single:'Single',double:'Double',twin:'Twin',triple:'Triple',suite:'Suite',dorm:'Dormitory',villa:'Villa',cottage:'Cottage',other:'Other'};
var ROOM_STATUS={available:'Available',reserved:'Reserved',paid:'Paid'};
var ROOM_STATUS_STYLE={available:'background:#f0f7f4;color:var(--green);',reserved:'background:var(--amber-light);color:var(--amber-dark);',paid:'background:#f0f7f4;color:var(--green);font-weight:700;'};

async function init(){
  await OctHeader.init('rooms');
  var res=await Promise.all([
    sb.from('rooms').select('*').eq('event_id',eventId).order('sort_order',{ascending:true}).order('created_at',{ascending:true}),
    sb.from('guests').select('id,first_name,last_name').eq('event_id',eventId)
  ]);
  allRooms=res[0].data||[]; allGuests=res[1].data||[];
  render();
}

function updateSummary(){
  var total=allRooms.length;
  if(!total){document.getElementById('r-summary').style.display='none';return;}
  document.getElementById('r-summary').style.display='grid';
  document.getElementById('r-total').textContent=total;
  document.getElementById('r-avail').textContent=allRooms.filter(function(r){return r.status==='available';}).length;
  document.getElementById('r-res').textContent=allRooms.filter(function(r){return r.status!=='available';}).length;
  document.getElementById('r-cap').textContent=allRooms.reduce(function(s,r){return s+(r.capacity||0);},0);
  document.getElementById('r-inc').textContent=fmtSum(allRooms.reduce(function(s,r){return s+(parseFloat(r.price_per_night||0)*(r.nights||1));},0));
  document.getElementById('stat-rooms').textContent=allRooms.filter(function(r){return r.status!=='available';}).length;
  sb.from('events').update({room_count:total}).eq('id',eventId);
}

function buildRoomRow(room){
  var tr=document.createElement('tr');tr.dataset.id=room.id;
  var total=parseFloat(room.price_per_night||0)*(room.nights||1);
  var g=allGuests.find(function(g){return g.id===room.guest_id;});

  function editableTd(field,type,cls){
    var td=document.createElement('td');if(cls)td.className=cls;
    renderRoomCell(td,room,field,type);
    td.style.cursor='pointer';
    td.addEventListener('click',function(){editRoomCell(td,room,field,type);});
    return td;
  }

  ['accommodation','name'].forEach(function(f){tr.appendChild(editableTd(f,'text'));});
  tr.appendChild(editableTd('type','room-type'));
  tr.appendChild(editableTd('capacity','num','num'));
  tr.appendChild(editableTd('price_per_night','num','num'));
  tr.appendChild(editableTd('nights','num','num'));
  var totTd=document.createElement('td');totTd.className='num';totTd.textContent=total>0?fmtEuro(total):'—';tr.appendChild(totTd);
  tr.appendChild(editableTd('status','room-status'));
  tr.appendChild(editableTd('guest_id','room-guest'));
  tr.appendChild(editableTd('notes','text'));
  var delTd=document.createElement('td');var btn=document.createElement('button');btn.className='row-del';btn.textContent='Delete';btn.onclick=function(){deleteRoom(room.id);};delTd.appendChild(btn);tr.appendChild(delTd);
  return tr;
}

function renderRoomCell(td,room,f,type){
  if(type==='room-type')td.innerHTML='<span style="font-size:0.78rem;">'+(ROOM_TYPES[room[f]||'double']||'Double')+'</span>';
  else if(type==='room-status')td.innerHTML='<span class="badge" style="'+(ROOM_STATUS_STYLE[room[f]||'available'])+'">'+(ROOM_STATUS[room[f]||'available'])+'</span>';
  else if(type==='room-guest'){var g=allGuests.find(function(g){return g.id===room.guest_id;});td.textContent=g?g.first_name+' '+(g.last_name||''):'— Unassigned';td.style.color=g?'var(--ink)':'var(--ink3)';td.style.fontSize='0.78rem';}
  else if(type==='num')td.textContent=f==='price_per_night'?fmtEuro(room[f]):(parseFloat(room[f]||0)||'—');
  else{td.textContent=room[f]||'—';if(f==='notes')td.style.fontSize='0.78rem';}
}

function editRoomCell(td,room,f,type){
  if(td.classList.contains('editing'))return;td.classList.add('editing');
  var input;
  if(type==='room-type'){input=document.createElement('select');input.className='inline-select';Object.keys(ROOM_TYPES).forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=ROOM_TYPES[v];if(v===(room[f]||'double'))o.selected=true;input.appendChild(o);});}
  else if(type==='room-status'){input=document.createElement('select');input.className='inline-select';Object.keys(ROOM_STATUS).forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=ROOM_STATUS[v];if(v===(room[f]||'available'))o.selected=true;input.appendChild(o);});}
  else if(type==='room-guest'){input=document.createElement('select');input.className='inline-select';var none=document.createElement('option');none.value='';none.textContent='— Unassigned';if(!room[f])none.selected=true;input.appendChild(none);allGuests.forEach(function(g){var o=document.createElement('option');o.value=g.id;o.textContent=g.first_name+' '+(g.last_name||'');if(g.id===room[f])o.selected=true;input.appendChild(o);});}
  else{input=document.createElement('input');input.className='inline-input';input.type=type==='num'?'number':'text';input.value=room[f]||'';if(type==='num'){input.step='0.01';input.min='0';}}
  td.innerHTML='';td.appendChild(input);input.focus();if(input.select)input.select();
  var saved=false;
  function save(){if(saved)return;saved=true;var val=type==='num'?parseFloat(input.value)||0:input.value.trim()||null;room[f]=val;td.classList.remove('editing');render();sb.from('rooms').update({[f]:val}).eq('id',room.id);}
  input.addEventListener('blur',save);
  input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();input.blur();}if(e.key==='Escape'){saved=true;td.classList.remove('editing');renderRoomCell(td,room,f,type);}});
}

function render(){
  updateSummary();
  var el=document.getElementById('r-content');
  if(!allRooms.length){el.innerHTML='<div class="empty-state"><div class="icon">&#x1F6CF;</div><h3>No rooms yet</h3><p>Add rooms to manage accommodation for your event.</p><button class="btn amber" onclick="addRoom()">+ Add first room</button></div>';return;}
  var totalInc=allRooms.reduce(function(s,r){return s+(parseFloat(r.price_per_night||0)*(r.nights||1));},0);
  var totalCap=allRooms.reduce(function(s,r){return s+(r.capacity||0);},0);
  var wrap=document.createElement('div');wrap.className='table-wrap table-scroll';
  var tbl=document.createElement('table');
  tbl.innerHTML='<thead><tr><th>Accommodation</th><th>Room name</th><th>Type</th><th class="num">Capacity</th><th class="num">Price/night</th><th class="num">Nights</th><th class="num">Total</th><th>Status</th><th>Assigned guest</th><th>Notes</th><th></th></tr></thead>';
  var tbody=document.createElement('tbody');
  allRooms.forEach(function(room){tbody.appendChild(buildRoomRow(room));});
  var tfoot=document.createElement('tfoot');
  tfoot.innerHTML='<tr style="background:var(--cream);border-top:2px solid var(--rule);"><td colspan="3"><strong>Totals</strong></td><td class="num"><strong>'+totalCap+'</strong></td><td colspan="2"></td><td class="num"><strong>'+fmtSum(totalInc)+'</strong></td><td colspan="4"></td></tr>';
  tbl.appendChild(tbody);tbl.appendChild(tfoot);wrap.appendChild(tbl);
  el.innerHTML='';el.appendChild(wrap);
}

async function addRoom(){var res=await sb.from('rooms').insert([{event_id:eventId,accommodation:'',name:'New room',type:'double',capacity:2,price_per_night:0,nights:1,notes:'',status:'available',sort_order:allRooms.length}]).select().single();if(!res.error&&res.data){allRooms.push(res.data);render();setTimeout(function(){var r=document.querySelector('tr[data-id="'+res.data.id+'"]');if(r){r.scrollIntoView({behavior:'smooth',block:'center'});var c=r.querySelector('td');if(c)c.click();}},80);}}
async function deleteRoom(id){if(!confirm('Delete this room?'))return;await sb.from('rooms').delete().eq('id',id);allRooms=allRooms.filter(function(r){return r.id!==id;});render();}
init();

</script>
</body>
</html>
