<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octevent — Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared.js"></script>
<style>
.summary{display:flex;gap:2rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.sum-n{font-size:1.4rem;font-weight:800;line-height:1.1;}
.sum-l{font-size:0.7rem;color:var(--ink3);text-transform:uppercase;letter-spacing:0.06em;}

.rooms{display:flex;flex-direction:column;gap:0.85rem;}
.room{display:flex;gap:1.1rem;background:var(--white);border:1px solid var(--rule);border-radius:var(--radius);padding:0.9rem;align-items:stretch;}
.room-img{width:150px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--purple-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--purple);position:relative;}
.room-img img{width:100%;height:100%;object-fit:cover;}
.room-img svg{width:26px;height:26px;opacity:0.6;}
.room-img .count{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.6);color:#fff;font-size:0.68rem;font-weight:600;padding:2px 7px;border-radius:100px;}
.room-body{flex:1;min-width:0;display:flex;flex-direction:column;}
.room-top{display:flex;justify-content:space-between;gap:0.75rem;align-items:flex-start;}
.room-name{font-weight:700;font-size:1rem;}
.room-price{font-weight:800;font-size:1rem;white-space:nowrap;}
.room-facts{display:flex;gap:1rem;font-size:0.8rem;color:var(--ink2);margin-top:0.3rem;flex-wrap:wrap;}
.room-facts span{display:inline-flex;align-items:center;gap:5px;}
.room-facts svg{width:14px;height:14px;color:var(--ink3);}
.room-desc{font-size:0.82rem;color:var(--ink3);margin-top:0.4rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.room-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:0.6rem;gap:0.5rem;}
.room-tools{display:flex;gap:0.35rem;}
@media (max-width:640px){
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
  .room{flex-direction:column;}
  .room-img{width:100%;aspect-ratio:16/9;}
}

/* photo manager in modal */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:0.6rem;}
.photo{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--cream);border:1px solid var(--rule);}
.photo img{width:100%;height:100%;object-fit:cover;}
.photo .main-tag{position:absolute;top:5px;left:5px;background:var(--purple);color:#fff;font-size:0.6rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;padding:2px 6px;border-radius:100px;}
.photo .p-tools{position:absolute;bottom:4px;right:4px;display:flex;gap:4px;}
.photo .p-tools button{width:24px;height:24px;border-radius:6px;border:none;background:rgba(255,255,255,0.92);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);}
.photo .p-tools button:hover{background:#fff;color:var(--purple);}
.photo .p-tools svg{width:13px;height:13px;}
.photo-add{aspect-ratio:4/3;border-radius:8px;border:1.5px dashed #d9d6cd;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:0.72rem;color:var(--ink3);cursor:pointer;}
.photo-add:hover{border-color:var(--purple);color:var(--purple);}
.photo-add svg{width:18px;height:18px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;}
@media (max-width:640px){.grid-3{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<main class="main">
  <div class="content">
    <div class="page-head">
      <div>
        <h1>Rooms</h1>
        <div class="page-sub">The rooms your guests can choose from. They'll appear on your guest page in this order.</div>
      </div>
      <button class="btn btn-primary" onclick="openRoom()" id="add-btn" style="display:none"></button>
    </div>
    <div id="summary" class="summary"></div>
    <div id="list"><div class="spinner"></div></div>
  </div>
</main>

<!-- ROOM MODAL -->
<div class="modal-wrap" id="room-modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Add a room</h2>
      <button class="modal-close" onclick="closeRoom()" aria-label="Close" id="close-ic"></button>
    </div>
    <div class="field"><label for="r-name">Room name</label><input class="input" id="r-name" placeholder="e.g. The Olive Suite"></div>
    <div class="grid-3">
      <div class="field">
        <label for="r-price">Price for the stay</label>
        <div class="input-prefix"><span>€</span><input class="input" type="number" min="0" step="0.01" id="r-price" placeholder="0"></div>
      </div>
      <div class="field"><label for="r-sleeps">Sleeps</label><input class="input" type="number" min="1" max="20" id="r-sleeps"></div>
      <div class="field"><label for="r-bed">Beds</label><input class="input" id="r-bed" placeholder="e.g. 1 king"></div>
    </div>
    <div class="field">
      <label for="r-desc">Description</label>
      <textarea class="input" id="r-desc" rows="4" placeholder="Sea views, private terrace, ensuite with rain shower..."></textarea>
    </div>
    <div class="field">
      <label>Photos</label>
      <div class="photos" id="photos"></div>
      <div class="hint">The first photo is the main one guests see. Use the arrow to move a photo to the front.</div>
      <input type="file" id="photo-file" accept="image/*" multiple hidden>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeRoom()">Cancel</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveRoom()">Save room</button>
    </div>
  </div>
</div>

<script>
let user, ev, rooms = [], bookedIds = new Set();
let editing = null;          // room being edited (null = new)
let draftPhotos = [];        // photos in the modal
let newUploads = [];         // uploaded during this modal session (removed again on cancel)
let uploadingCount = 0;
const $ = id => document.getElementById(id);

(async function init() {
  user = await requireUser(); if (!user) return;
  ev = await loadEventOrLeave(); if (!ev) return;
  Layout.render('rooms', user, ev);
  $('add-btn').innerHTML = ICON.plus + 'Add room';
  $('close-ic').innerHTML = ICON.close;
  $('photo-file').addEventListener('change', addPhotos);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('room-modal').classList.contains('open')) closeRoom(); });
  await load();
})();

async function load() {
  const [r, b] = await Promise.all([
    sb.from('rooms').select('*').eq('event_id', ev.id).order('sort_order').order('created_at'),
    sb.from('bookings').select('room_id').eq('event_id', ev.id).neq('status', 'cancelled')
  ]);
  if (r.error) { $('list').innerHTML = '<div class="notice notice-error">Could not load rooms: ' + esc(r.error.message) + '</div>'; return; }
  rooms = r.data;
  bookedIds = new Set((b.data || []).map(x => x.room_id));
  render();
}

function render() {
  $('add-btn').style.display = rooms.length ? 'inline-flex' : 'none';
  if (!rooms.length) {
    $('summary').innerHTML = '';
    $('list').innerHTML = '<div class="empty">' + ICON.rooms +
      '<h3>Add your first room</h3><p>Give each room a name, a price for the stay and a few photos. Guests will browse these and pick the one they want.</p>' +
      '<button class="btn btn-primary" onclick="openRoom()">' + ICON.plus + 'Add a room</button></div>';
    return;
  }
  const beds = rooms.reduce((s, r) => s + (r.sleeps || 0), 0);
  const total = rooms.reduce((s, r) => s + Number(r.price || 0), 0);
  $('summary').innerHTML =
    '<div><div class="sum-n">' + rooms.length + '</div><div class="sum-l">Rooms</div></div>' +
    '<div><div class="sum-n">' + beds + '</div><div class="sum-l">Guests it sleeps</div></div>' +
    '<div><div class="sum-n">' + bookedIds.size + '</div><div class="sum-l">Booked</div></div>' +
    '<div><div class="sum-n">' + fmtEuro(total) + '</div><div class="sum-l">If all rooms book</div></div>';

  $('list').innerHTML = '<div class="rooms">' + rooms.map((r, i) => {
    const photo = r.photos && r.photos[0];
    const booked = bookedIds.has(r.id);
    return '<div class="room">' +
      '<div class="room-img">' + (photo ? '<img src="' + esc(photo) + '" alt="" loading="lazy">' : ICON.image) +
        (r.photos && r.photos.length > 1 ? '<span class="count">' + r.photos.length + ' photos</span>' : '') + '</div>' +
      '<div class="room-body">' +
        '<div class="room-top"><div class="room-name">' + esc(r.name) + '</div><div class="room-price">' + fmtEuro(r.price) + '</div></div>' +
        '<div class="room-facts"><span>' + ICON.person + 'Sleeps ' + (r.sleeps || '–') + '</span>' +
          (r.bed_type ? '<span>' + ICON.bed + esc(r.bed_type) + '</span>' : '') + '</div>' +
        (r.description ? '<div class="room-desc">' + esc(r.description) + '</div>' : '') +
        '<div class="room-foot">' +
          (booked ? '<span class="badge badge-green">Booked</span>' : '<span class="badge badge-grey">Available</span>') +
          '<div class="room-tools">' +
            '<button class="icon-btn" title="Move up" onclick="move(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + '>' + ICON.up + '</button>' +
            '<button class="icon-btn" title="Move down" onclick="move(' + i + ',1)"' + (i === rooms.length - 1 ? ' disabled' : '') + '>' + ICON.down + '</button>' +
            '<button class="icon-btn" title="Duplicate" onclick="duplicate(' + i + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>' +
            '<button class="icon-btn" title="Edit" onclick="openRoom(' + i + ')">' + ICON.edit + '</button>' +
            '<button class="icon-btn" title="Delete" onclick="removeRoom(' + i + ')">' + ICON.trash + '</button>' +
          '</div></div></div></div>';
  }).join('') + '</div>';
}

// ── MODAL ──
function openRoom(i) {
  editing = i === undefined ? null : rooms[i];
  const r = editing || {};
  $('modal-title').textContent = editing ? 'Edit room' : 'Add a room';
  $('r-name').value = r.name || '';
  $('r-price').value = editing ? r.price : '';
  $('r-sleeps').value = r.sleeps || 2;
  $('r-bed').value = r.bed_type || '';
  $('r-desc').value = r.description || '';
  draftPhotos = (r.photos || []).slice();
  newUploads = [];
  renderPhotos();
  $('room-modal').classList.add('open');
  setTimeout(() => $('r-name').focus(), 50);
}

function closeRoom() {
  if (uploadingCount) return toast('Please wait for photos to finish uploading.', true);
  newUploads.forEach(deleteImage);   // tidy up photos added but not saved
  newUploads = [];
  $('room-modal').classList.remove('open');
}

function renderPhotos() {
  $('photos').innerHTML = draftPhotos.map((url, i) =>
    '<div class="photo"><img src="' + esc(url) + '" alt="">' +
    (i === 0 ? '<span class="main-tag">Main</span>' : '') +
    '<div class="p-tools">' +
      (i > 0 ? '<button title="Make main photo" onclick="makeMain(' + i + ')">' + ICON.up.replace('points="18 15 12 9 6 15"', 'points="15 18 9 12 15 6"') + '</button>' : '') +
      '<button title="Remove" onclick="removePhoto(' + i + ')">' + ICON.close + '</button>' +
    '</div></div>'
  ).join('') +
  (uploadingCount ? '<div class="photo-add" style="cursor:default">Uploading ' + uploadingCount + '...</div>' : '') +
  '<div class="photo-add" onclick="document.getElementById(\'photo-file\').click()">' + ICON.plus + 'Add photos</div>';
}

async function addPhotos(e) {
  const files = Array.from(e.target.files); e.target.value = '';
  if (!files.length) return;
  uploadingCount += files.length; renderPhotos();
  for (const f of files) {
    try {
      const url = await uploadImage(f, user.id, ev.id);
      draftPhotos.push(url); newUploads.push(url);
    } catch (err) {
      toast('A photo failed to upload: ' + (err.message || err), true);
    }
    uploadingCount--; renderPhotos();
  }
}
function makeMain(i) { draftPhotos.unshift(draftPhotos.splice(i, 1)[0]); renderPhotos(); }
function removePhoto(i) { draftPhotos.splice(i, 1); renderPhotos(); }

async function saveRoom() {
  if (uploadingCount) return toast('Please wait for photos to finish uploading.', true);
  const name = $('r-name').value.trim();
  const price = parseFloat($('r-price').value);
  const sleeps = parseInt($('r-sleeps').value, 10);
  if (!name) return toast('Please give the room a name.', true);
  if (isNaN(price) || price < 0) return toast('Please enter a price (0 if it\'s free).', true);
  if (!sleeps || sleeps < 1) return toast('How many people does it sleep?', true);

  const row = {
    name, price, sleeps,
    bed_type: $('r-bed').value.trim() || null,
    description: $('r-desc').value.trim() || null,
    photos: draftPhotos
  };
  const btn = $('save-btn'); btn.disabled = true; btn.textContent = 'Saving...';
  let error;
  if (editing) {
    ({ error } = await sb.from('rooms').update(row).eq('id', editing.id));
  } else {
    row.event_id = ev.id;
    row.sort_order = rooms.length ? Math.max.apply(null, rooms.map(r => r.sort_order)) + 1 : 0;
    ({ error } = await sb.from('rooms').insert(row));
  }
  btn.disabled = false; btn.textContent = 'Save room';
  if (error) return toast('Could not save: ' + error.message, true);

  // photos removed from an existing room can now be deleted from storage
  if (editing) (editing.photos || []).filter(u => !draftPhotos.includes(u)).forEach(deleteImage);
  newUploads = [];
  $('room-modal').classList.remove('open');
  toast(editing ? 'Room updated' : 'Room added');
  await load();
}

// ── LIST ACTIONS ──
async function move(i, dir) {
  const a = rooms[i], b = rooms[i + dir];
  if (!b) return;
  // give every room a clean position first, then swap the two
  rooms.forEach((r, idx) => r.sort_order = idx);
  a.sort_order = i + dir; b.sort_order = i;
  rooms.sort((x, y) => x.sort_order - y.sort_order);
  render();
  const results = await Promise.all(rooms.map(r => sb.from('rooms').update({ sort_order: r.sort_order }).eq('id', r.id)));
  const failed = results.find(x => x.error);
  if (failed) { toast('Could not save the new order: ' + failed.error.message, true); load(); }
}

async function duplicate(i) {
  const r = rooms[i];
  const { error } = await sb.from('rooms').insert({
    event_id: ev.id, name: r.name + ' (copy)', price: r.price, sleeps: r.sleeps, bed_type: r.bed_type,
    description: r.description, photos: [],   // photos aren't copied, so deleting one room never breaks another
    sort_order: Math.max.apply(null, rooms.map(x => x.sort_order)) + 1
  });
  if (error) return toast('Could not duplicate: ' + error.message, true);
  toast('Room copied (without photos)');
  load();
}

async function removeRoom(i) {
  const r = rooms[i];
  const msg = bookedIds.has(r.id)
    ? '"' + r.name + '" is booked by a guest. Deleting it also removes their booking.\n\nDelete anyway?'
    : 'Delete "' + r.name + '"?';
  if (!confirm(msg)) return;
  const { error } = await sb.from('rooms').delete().eq('id', r.id);
  if (error) return toast('Could not delete: ' + error.message, true);
  (r.photos || []).forEach(deleteImage);
  toast('Room deleted');
  load();
}
</script>
</body>
</html>
