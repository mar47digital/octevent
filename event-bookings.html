<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octevent — Bookings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared.js"></script>
<style>
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0.75rem;margin-bottom:1.5rem;}
.stat{background:var(--white);border:1px solid var(--rule);border-radius:var(--radius);padding:0.9rem 1rem;}
.stat-n{font-size:1.45rem;font-weight:800;line-height:1.1;}
.stat-n small{font-size:0.85rem;color:var(--ink3);font-weight:600;}
.stat-l{font-size:0.7rem;color:var(--ink3);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}
.stat.green .stat-n{color:var(--green);}
.bar{height:6px;border-radius:100px;background:var(--rule);overflow:hidden;margin-top:0.6rem;}
.bar span{display:block;height:100%;background:var(--green);}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr;}}

.table{background:var(--white);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;}
.b-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) 90px 100px 300px;gap:1rem;align-items:center;padding:0.85rem 1.1rem;border-bottom:1px solid var(--rule);}
.b-row:last-child{border-bottom:none;}
.b-head{background:var(--cream);font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink3);padding-top:0.6rem;padding-bottom:0.6rem;}
.room-cell{display:flex;align-items:center;gap:0.75rem;min-width:0;}
.room-thumb{width:48px;height:36px;border-radius:6px;background:var(--purple-light);flex-shrink:0;overflow:hidden;}
.room-thumb img{width:100%;height:100%;object-fit:cover;}
.room-name{font-weight:600;font-size:0.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.guest-name{font-weight:600;font-size:0.88rem;}
.guest-email{font-size:0.76rem;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.muted{color:#b5b2a8;font-size:0.85rem;}
.amount{font-weight:700;font-size:0.92rem;}
.paid-date{font-size:0.72rem;color:var(--ink3);}
.actions{display:flex;gap:0.35rem;justify-content:flex-end;flex-wrap:nowrap;}
.btn-sm{padding:0.4rem 0.8rem;font-size:0.76rem;}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{filter:brightness(0.92);}
@media (max-width:820px){
  .b-head{display:none;}
  .b-row{grid-template-columns:1fr auto;gap:0.5rem 0.75rem;}
  .b-row > .c-guest{grid-column:1/-1;}
  .b-row > .c-actions{grid-column:1/-1;}
  .actions{justify-content:flex-start;flex-wrap:wrap;}
}

.pick{display:flex;flex-direction:column;gap:0.4rem;max-height:320px;overflow-y:auto;margin-bottom:0.5rem;}
.pick label{display:flex;align-items:center;gap:10px;padding:0.65rem 0.85rem;border:1.5px solid var(--rule);border-radius:10px;cursor:pointer;}
.pick label:has(input:checked){border-color:var(--purple);background:var(--purple-light);}
.pick input{accent-color:var(--purple);}
.pick small{display:block;color:var(--ink3);font-size:0.76rem;}
</style>
</head>
<body>
<main class="main">
  <div class="content">
    <div class="page-head">
      <div>
        <h1>Bookings</h1>
        <div class="page-sub">Who has which room, and what's been paid. Mark rooms as paid when the money arrives.</div>
      </div>
    </div>
    <div id="stats"></div>
    <div id="list"><div class="spinner"></div></div>
  </div>
</main>

<!-- ASSIGN MODAL -->
<div class="modal-wrap" id="assign-modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="assign-title">Give this room to a guest</h2>
      <button class="modal-close" onclick="closeAssign()" aria-label="Close" id="close-ic"></button>
    </div>
    <p style="font-size:0.85rem;color:var(--ink3);margin-bottom:1rem">Guests who are coming and don't have a room yet:</p>
    <div class="pick" id="pick"></div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeAssign()">Cancel</button>
      <button class="btn btn-primary" id="assign-btn" onclick="confirmAssign()">Reserve room</button>
    </div>
  </div>
</div>

<!-- AMOUNT MODAL -->
<div class="modal-wrap" id="amount-modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-head">
      <h2>Change amount</h2>
      <button class="modal-close" onclick="closeAmount()" aria-label="Close" id="close-ic2"></button>
    </div>
    <p style="font-size:0.85rem;color:var(--ink3);margin-bottom:1rem" id="amount-text"></p>
    <div class="field">
      <label for="amount-input">Amount this guest pays</label>
      <div class="input-prefix"><span>€</span><input class="input" type="number" min="0" step="0.01" id="amount-input"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeAmount()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAmount()">Save</button>
    </div>
  </div>
</div>

<script>
let user, ev, rooms = [], bookings = [], guests = [], assignRoom = null, amountBooking = null;
const $ = id => document.getElementById(id);

(async function init() {
  user = await requireUser(); if (!user) return;
  ev = await loadEventOrLeave(); if (!ev) return;
  Layout.render('bookings', user, ev);
  $('close-ic').innerHTML = ICON.close;
  $('close-ic2').innerHTML = ICON.close;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeAssign(); closeAmount(); } });
  await load();
})();

async function load() {
  const [r, b, g] = await Promise.all([
    sb.from('rooms').select('id,name,price,photos,sort_order').eq('event_id', ev.id).order('sort_order').order('created_at'),
    sb.from('bookings').select('*').eq('event_id', ev.id).neq('status', 'cancelled'),
    sb.from('guests').select('id,first_name,last_name,email,rsvp_status').eq('event_id', ev.id)
  ]);
  const err = r.error || b.error || g.error;
  if (err) { $('list').innerHTML = '<div class="notice notice-error">Could not load bookings: ' + esc(err.message) + '</div>'; return; }
  rooms = r.data; bookings = b.data; guests = g.data;
  render();
}

const guestName = g => g ? ([g.first_name, g.last_name].filter(Boolean).join(' ') || g.email || 'Guest') : 'Unknown guest';
function fmtShort(ts) { return ts ? new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : ''; }

function render() {
  if (!rooms.length) {
    $('stats').innerHTML = '';
    $('list').innerHTML = '<div class="empty">' + ICON.bookings + '<h3>No rooms yet</h3><p>Add rooms first. Once guests reserve them on your guest site, they\'ll show up here.</p>' +
      '<a class="btn btn-primary" href="/event-rooms?id=' + ev.id + '">Add rooms</a></div>';
    return;
  }
  const byRoom = {}; bookings.forEach(b => byRoom[b.room_id] = b);
  const expected = bookings.reduce((s, b) => s + Number(b.amount || 0), 0);
  const paid = bookings.filter(b => b.status === 'paid').reduce((s, b) => s + Number(b.amount || 0), 0);
  const pct = expected ? Math.round(paid / expected * 100) : 0;

  $('stats').innerHTML = '<div class="stats">' +
    '<div class="stat"><div class="stat-n">' + bookings.length + '<small> / ' + rooms.length + '</small></div><div class="stat-l">Rooms reserved</div></div>' +
    '<div class="stat"><div class="stat-n">' + fmtEuro(expected) + '</div><div class="stat-l">Due from bookings</div></div>' +
    '<div class="stat green"><div class="stat-n">' + fmtEuro(paid) + '</div><div class="stat-l">Paid</div><div class="bar"><span style="width:' + pct + '%"></span></div></div>' +
    '<div class="stat"><div class="stat-n">' + fmtEuro(expected - paid) + '</div><div class="stat-l">Still to collect</div></div>' +
    '</div>';

  $('list').innerHTML = '<div class="table"><div class="b-row b-head"><div>Room</div><div>Guest</div><div>Amount</div><div>Status</div><div></div></div>' +
    rooms.map(r => {
      const b = byRoom[r.id];
      const g = b ? guests.find(x => x.id === b.guest_id) : null;
      const photo = r.photos && r.photos[0];
      const roomCell = '<div class="room-cell"><div class="room-thumb">' + (photo ? '<img src="' + esc(photo) + '" alt="">' : '') + '</div><div class="room-name">' + esc(r.name) + '</div></div>';
      if (!b) {
        return '<div class="b-row">' + roomCell +
          '<div class="c-guest"><span class="muted">Available</span></div>' +
          '<div class="amount" style="color:var(--ink3);font-weight:600">' + fmtEuro(r.price) + '</div>' +
          '<div><span class="badge badge-grey">Free</span></div>' +
          '<div class="c-actions actions"><button class="btn btn-ghost btn-sm" onclick="openAssign(\'' + r.id + '\')">Give to a guest</button></div></div>';
      }
      const isPaid = b.status === 'paid';
      return '<div class="b-row">' + roomCell +
        '<div class="c-guest" style="min-width:0"><div class="guest-name">' + esc(guestName(g)) + '</div><div class="guest-email">' + esc(g && g.email || '') + '</div></div>' +
        '<div><div class="amount">' + fmtEuro(b.amount) + '</div>' + (Number(b.amount) !== Number(r.price) ? '<div class="paid-date">Room price ' + fmtEuro(r.price) + '</div>' : '') + '</div>' +
        '<div>' + (isPaid ? '<span class="badge badge-green">Paid</span><div class="paid-date">' + fmtShort(b.paid_at) + '</div>' : '<span class="badge badge-purple">Reserved</span><div class="paid-date">Not paid yet</div>') + '</div>' +
        '<div class="c-actions actions">' +
          (isPaid ? '<button class="btn btn-ghost btn-sm" onclick="setPaid(\'' + b.id + '\',false)">Mark unpaid</button>'
                  : '<button class="btn btn-green btn-sm" onclick="setPaid(\'' + b.id + '\',true)">Mark paid</button>') +
          '<button class="btn btn-ghost btn-sm" onclick="openAmount(\'' + b.id + '\')">Amount</button>' +
          '<button class="btn btn-danger btn-sm" onclick="cancelBooking(\'' + b.id + '\')">Free room</button>' +
        '</div></div>';
    }).join('') + '</div>';
}

async function setPaid(id, paid) {
  const { error } = await sb.from('bookings').update({ status: paid ? 'paid' : 'reserved', paid_at: paid ? new Date().toISOString() : null }).eq('id', id);
  if (error) return toast('Could not update: ' + error.message, true);
  toast(paid ? 'Marked as paid' : 'Marked as not paid');
  load();
}

async function cancelBooking(id) {
  const b = bookings.find(x => x.id === id);
  const g = guests.find(x => x.id === b.guest_id);
  const r = rooms.find(x => x.id === b.room_id);
  const warn = b.status === 'paid' ? '\n\nThis booking is marked as PAID. Remember to sort out any refund yourself.' : '';
  if (!confirm('Free up ' + r.name + '?\n\n' + guestName(g) + ' will no longer have a room, and other guests will be able to reserve it.' + warn)) return;
  const { error } = await sb.from('bookings').update({ status: 'cancelled' }).eq('id', id);
  if (error) return toast('Could not free the room: ' + error.message, true);
  toast('Room is free again');
  load();
}

// ── GIVE A ROOM TO A GUEST ──
function openAssign(roomId) {
  assignRoom = rooms.find(r => r.id === roomId);
  const withRoom = new Set(bookings.map(b => b.guest_id));
  const options = guests.filter(g => g.rsvp_status === 'confirmed' && !withRoom.has(g.id))
    .sort((a, b) => guestName(a).localeCompare(guestName(b)));
  $('assign-title').textContent = 'Give ' + assignRoom.name + ' to a guest';
  $('pick').innerHTML = options.length
    ? options.map((g, i) => '<label><input type="radio" name="pick" value="' + g.id + '"' + (i ? '' : ' checked') + '><span>' + esc(guestName(g)) + '<small>' + esc(g.email || 'No email') + '</small></span></label>').join('')
    : '<div class="notice notice-info" style="background:var(--cream)">Every guest who\'s coming already has a room. Add a guest (or mark someone as coming) on the <a href="/event-guests?id=' + ev.id + '" style="font-weight:700">Guests page</a> first.</div>';
  $('assign-btn').style.display = options.length ? 'inline-flex' : 'none';
  $('assign-modal').classList.add('open');
}
function closeAssign() { $('assign-modal').classList.remove('open'); }

async function confirmAssign() {
  const picked = document.querySelector('input[name=pick]:checked');
  if (!picked) return;
  const btn = $('assign-btn'); btn.disabled = true;
  const { error } = await sb.from('bookings').insert({ event_id: ev.id, room_id: assignRoom.id, guest_id: picked.value, amount: assignRoom.price, status: 'reserved' });
  btn.disabled = false;
  if (error) {
    closeAssign(); load();
    return toast(/bookings_one_per_room|duplicate/i.test(error.message) ? 'Someone has just reserved that room.' : 'Could not reserve: ' + error.message, true);
  }
  closeAssign();
  toast('Room reserved');
  load();
}

// ── AMOUNT ──
function openAmount(id) {
  amountBooking = bookings.find(b => b.id === id);
  const r = rooms.find(x => x.id === amountBooking.room_id);
  $('amount-text').textContent = 'For a discount or an extra charge. The room\'s normal price is ' + fmtEuro(r.price) + '.';
  $('amount-input').value = amountBooking.amount;
  $('amount-modal').classList.add('open');
  setTimeout(() => $('amount-input').select(), 50);
}
function closeAmount() { $('amount-modal').classList.remove('open'); }
async function saveAmount() {
  const v = parseFloat($('amount-input').value);
  if (isNaN(v) || v < 0) return toast('Please enter an amount.', true);
  const { error } = await sb.from('bookings').update({ amount: v }).eq('id', amountBooking.id);
  if (error) return toast('Could not save: ' + error.message, true);
  closeAmount(); toast('Amount updated'); load();
}
</script>
</body>
</html>
