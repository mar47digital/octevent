<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octevent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared.js"></script>
<script src="/header.js"></script>
</head>
<body>
<div id="app-header"></div>
<main>
<div class="panel-header">
  <div class="panel-header-left">
    <div class="panel-title">Guests</div>
    <button class="btn" onclick="exportCSV()">Export CSV</button>
    <button class="btn" onclick="document.getElementById('g-import').click()">Import CSV</button>
    <input type="file" id="g-import" accept=".csv" style="display:none" onchange="startImport(event)">
    <button class="btn danger" onclick="clearAll()">Clear all</button>
  </div>
  <button class="btn amber" onclick="openAddModal()">+ Add guest</button>
</div>
<div id="g-content"><div class="spinner"></div></div>
</main>
<div class="modal-overlay" id="add-guest-modal" onclick="if(event.target===this)closeAddModal()">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">Add guest</div><button class="modal-close" onclick="closeAddModal()">&#x2715;</button></div>
    <div class="field-row">
      <div class="field"><label>First name *</label><input type="text" id="g-first"></div>
      <div class="field"><label>Last name</label><input type="text" id="g-last"></div>
    </div>
    <div class="field"><label>Email</label><input type="email" id="g-email"></div>
    <div class="field-row">
      <div class="field"><label>RSVP</label><select id="g-rsvp"><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="declined">Declined</option></select></div>
      <div class="field"><label>Dietary</label><input type="text" id="g-dietary"></div>
    </div>
    <div class="field"><label>Notes</label><input type="text" id="g-notes"></div>
    <div class="modal-footer"><button class="btn-cancel" onclick="closeAddModal()">Cancel</button><button class="btn-primary" onclick="addGuest()">Add guest</button></div>
  </div>
</div>
<div class="modal-overlay" id="import-modal" onclick="if(event.target===this)closeImportModal()">
  <div class="modal" style="max-width:520px;">
    <div class="modal-header"><div class="modal-title">Map CSV columns</div><button class="modal-close" onclick="closeImportModal()">&#x2715;</button></div>
    <p style="font-size:0.81rem;color:var(--ink3);margin-bottom:1rem;">Match your CSV columns to guest fields.</p>
    <div id="import-map"></div>
    <div style="background:var(--cream);border-radius:8px;padding:0.7rem;margin-top:0.75rem;font-size:0.72rem;color:var(--ink3);font-family:monospace;overflow:hidden;text-overflow:ellipsis;" id="import-preview"></div>
    <div class="modal-footer"><button class="btn-cancel" onclick="closeImportModal()">Cancel</button><button class="btn-primary" onclick="runImport()">Import</button></div>
  </div>
</div>
<script>

var allGuests=[], allRooms=[], tpTables=[];

async function init(){
  await OctHeader.init('guests');
  var res=await Promise.all([
    sb.from('guests').select('*').eq('event_id',eventId).order('created_at',{ascending:true}),
    sb.from('rooms').select('*').eq('event_id',eventId),
    sb.from('events').select('table_plan').eq('id',eventId).single()
  ]);
  allGuests=res[0].data||[];
  allRooms=res[1].data||[];
  tpTables=Array.isArray(res[2].data&&res[2].data.table_plan)?res[2].data.table_plan:[];
  render();
}

function getGuestTable(gid){return tpTables.find(function(t){return (t.guests||[]).includes(gid);});}
function getGuestRoom(gid){return allRooms.find(function(r){return r.guest_id===gid;});}

function render(){
  var el=document.getElementById('g-content');
  if(!allGuests.length){el.innerHTML='<div class="empty-state"><div class="icon">&#x1F465;</div><h3>No guests yet</h3><p>Add guests manually or import from CSV.</p><button class="btn amber" onclick="openAddModal()">+ Add first guest</button></div>';return;}
  var RSVP_STYLES={confirmed:'background:#f0f7f4;color:var(--green);',pending:'background:var(--amber-light);color:var(--amber-dark);',declined:'background:#fdf0f0;color:var(--red);'};
  var wrap=document.createElement('div');wrap.className='table-wrap table-scroll';
  var tbl=document.createElement('table');
  tbl.innerHTML='<thead><tr><th>Name</th><th>RSVP</th><th>Table</th><th>Room</th><th>Dietary</th><th>Notes</th><th></th></tr></thead>';
  var tbody=document.createElement('tbody');
  allGuests.forEach(function(g){
    var t=getGuestTable(g.id);
    var r=getGuestRoom(g.id);
    var rsvp=g.rsvp_status||'pending';
    var tr=document.createElement('tr');
    tr.innerHTML='<td><strong style="font-size:0.85rem;">'+g.first_name+' '+(g.last_name||'')+'</strong>'+(g.email?'<br><span style="font-size:0.72rem;color:var(--ink3);">'+g.email+'</span>':'')+'</td>'
      +'<td><select class="inline-select" style="border:1px solid var(--rule);border-radius:6px;" data-gid="'+g.id+'" class="rsvp-sel"><option value="pending" '+(rsvp==='pending'?'selected':'')+'>Pending</option><option value="confirmed" '+(rsvp==='confirmed'?'selected':'')+'>Confirmed</option><option value="declined" '+(rsvp==='declined'?'selected':'')+'>Declined</option></select></td>'
      +'<td><select class="inline-select" style="border:1px solid var(--rule);border-radius:6px;max-width:120px;" data-gid="'+g.id+'" class="table-sel"><option value="">— Table —</option>'+tpTables.map(function(tb){return '<option value="'+tb.id+'"'+(t&&t.id===tb.id?' selected':'')+'>'+tb.name+'</option>';}).join('')+'</select></td>'
      +'<td><select class="inline-select" style="border:1px solid var(--rule);border-radius:6px;max-width:120px;" data-gid="'+g.id+'" class="room-sel"><option value="">— Room —</option>'+allRooms.map(function(rm){return '<option value="'+rm.id+'"'+(r&&r.id===rm.id?' selected':'')+'>'+rm.name+'</option>';}).join('')+'</select></td>'
      +'<td style="font-size:0.78rem;">'+(g.dietary||'—')+'</td>'
      +'<td style="font-size:0.78rem;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+(g.notes||'—')+'</td>'
      +'<td><button class="row-del" data-gid="'+g.id+'">Delete</button></td>';
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);wrap.appendChild(tbl);
  el.innerHTML='';el.appendChild(wrap);
  el.querySelectorAll('.rsvp-sel').forEach(function(sel){sel.addEventListener('change',function(){updateRsvp(sel.dataset.gid,sel.value);});});
  el.querySelectorAll('.table-sel').forEach(function(sel){sel.addEventListener('change',function(){assignTable(sel.dataset.gid,sel.value);});});
  el.querySelectorAll('.room-sel').forEach(function(sel){sel.addEventListener('change',function(){assignRoom(sel.dataset.gid,sel.value);});});
  el.querySelectorAll('[data-gid].row-del').forEach(function(btn){btn.addEventListener('click',function(){deleteGuest(btn.dataset.gid);});});
}

async function updateRsvp(id,status){var g=allGuests.find(function(g){return g.id===id;});if(g)g.rsvp_status=status;var confirmed=allGuests.filter(function(g){return g.rsvp_status==='confirmed';}).length;await sb.from('guests').update({rsvp_status:status}).eq('id',id);await sb.from('events').update({rsvp_count:confirmed}).eq('id',eventId);document.getElementById('stat-guests').textContent=confirmed;}
async function assignTable(guestId,tableId){tpTables.forEach(function(t){t.guests=(t.guests||[]).filter(function(id){return id!==guestId;});});if(tableId){var t=tpTables.find(function(t){return t.id===tableId;});if(t){if(!t.guests)t.guests=[];t.guests.push(guestId);}}await sb.from('events').update({table_plan:tpTables}).eq('id',eventId);}
async function assignRoom(guestId,roomId){allRooms.forEach(function(r){if(r.guest_id===guestId){r.guest_id=null;r.status='available';sb.from('rooms').update({guest_id:null,status:'available'}).eq('id',r.id);}});if(roomId){var r=allRooms.find(function(r){return r.id===roomId;});if(r){r.guest_id=guestId;r.status='reserved';await sb.from('rooms').update({guest_id:guestId,status:'reserved'}).eq('id',roomId);}}}
async function deleteGuest(id){if(!confirm('Delete this guest?'))return;tpTables.forEach(function(t){t.guests=(t.guests||[]).filter(function(gid){return gid!==id;});});await Promise.all([sb.from('guests').delete().eq('id',id),sb.from('events').update({table_plan:tpTables,guest_count:allGuests.length-1}).eq('id',eventId)]);allGuests=allGuests.filter(function(g){return g.id!==id;});document.getElementById('stat-guests').textContent=allGuests.filter(function(g){return g.rsvp_status==='confirmed';}).length;render();}
async function clearAll(){if(!confirm('Delete ALL guests?'))return;await sb.from('guests').delete().eq('event_id',eventId);tpTables.forEach(function(t){t.guests=[];});await sb.from('events').update({guest_count:0,rsvp_count:0,table_plan:tpTables}).eq('id',eventId);allGuests=[];document.getElementById('stat-guests').textContent=0;render();}

function openAddModal(){['g-first','g-last','g-email','g-dietary','g-notes'].forEach(function(id){document.getElementById(id).value='';});document.getElementById('g-rsvp').value='pending';document.getElementById('add-guest-modal').classList.add('open');setTimeout(function(){document.getElementById('g-first').focus();},80);}
function closeAddModal(){document.getElementById('add-guest-modal').classList.remove('open');}
async function addGuest(){var first=document.getElementById('g-first').value.trim();if(!first){document.getElementById('g-first').style.borderColor='var(--red)';return;}var res=await sb.from('guests').insert([{event_id:eventId,first_name:first,last_name:document.getElementById('g-last').value.trim(),email:document.getElementById('g-email').value.trim(),rsvp_status:document.getElementById('g-rsvp').value,dietary:document.getElementById('g-dietary').value.trim(),notes:document.getElementById('g-notes').value.trim()}]).select().single();if(!res.error&&res.data){allGuests.push(res.data);await sb.from('events').update({guest_count:allGuests.length}).eq('id',eventId);document.getElementById('stat-guests').textContent=allGuests.filter(function(g){return g.rsvp_status==='confirmed';}).length;closeAddModal();render();}}

function exportCSV(){if(!allGuests.length){alert('No guests to export.');return;}var csv=['First name,Last name,Email,RSVP,Dietary,Notes'].concat(allGuests.map(function(g){return [g.first_name,g.last_name||'',g.email||'',g.rsvp_status||'pending',g.dietary||'',g.notes||''].map(function(v){return '"'+v.replace(/"/g,'""')+'"';}).join(',');})).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=(currentEvent?currentEvent.name:'event')+'-guests.csv';a.click();}

var _importRows=[], _importHeaders=[];
async function startImport(e){var file=e.target.files[0];if(!file)return;e.target.value='';var text=await file.text();var lines=text.split('\n').map(function(l){return l.replace(/\r$/,'');}).filter(function(l){return l.trim();});if(lines.length<2){alert('CSV appears empty.');return;}function parseRow(row){var cols=[],cur='',inQ=false;for(var i=0;i<row.length;i++){var ch=row[i];if(ch==='"'){if(inQ&&row[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}else if(ch===','&&!inQ){cols.push(cur.trim());cur='';}else cur+=ch;}cols.push(cur.trim());return cols;}_importHeaders=parseRow(lines[0]);_importRows=lines.slice(1).map(parseRow).filter(function(r){return r.some(function(c){return c.trim();});});var HINTS={first_name:['first','firstname','first name'],last_name:['last','lastname','last name','surname'],email:['email','e-mail'],rsvp_status:['rsvp','status','attending'],dietary:['dietary','diet'],notes:['notes','note','comments']};function best(k){var hs=HINTS[k]||[];for(var i=0;i<_importHeaders.length;i++){if(hs.indexOf(_importHeaders[i].toLowerCase().trim())>-1)return i;}return '';}var mapEl=document.getElementById('import-map');mapEl.innerHTML=['first_name','last_name','email','rsvp_status','dietary','notes'].map(function(k){return '<div class="field-row"><div style="display:flex;align-items:center;font-size:0.82rem;font-weight:500;">'+({first_name:'First name *',last_name:'Last name',email:'Email',rsvp_status:'RSVP',dietary:'Dietary',notes:'Notes'})[k]+'</div><select id="map-'+k+'" style="padding:0.5rem;border:1.5px solid var(--rule);border-radius:8px;font-family:DM Sans,sans-serif;font-size:0.82rem;outline:none;"><option value="">Skip</option>'+_importHeaders.map(function(h,i){return '<option value="'+i+'"'+(best(k)===i?' selected':'')+'>'+h+'</option>';}).join('')+'</select></div>';}).join('');if(_importRows[0])document.getElementById('import-preview').textContent=_importRows[0].map(function(v,i){return '['+ (_importHeaders[i]||i)+']: '+(v||'—');}).join('  |  ');document.getElementById('import-modal').classList.add('open');}
function closeImportModal(){document.getElementById('import-modal').classList.remove('open');_importRows=[];_importHeaders=[];}
async function runImport(){var gc=function(k){var s=document.getElementById('map-'+k);return s&&s.value!==''?parseInt(s.value):-1;};var fc=gc('first_name');if(fc===-1){alert('Please map the First name column.');return;}var RSVP_MAP={confirmed:'confirmed',yes:'confirmed',y:'confirmed',attending:'confirmed',declined:'declined',no:'declined',n:'declined',pending:'pending',maybe:'pending',tbc:'pending','':'pending'};var rows=_importRows.map(function(r){var fn=(r[fc]||'').trim();if(!fn)return null;var rv=(r[gc('rsvp_status')]||'').trim().toLowerCase();return{event_id:eventId,first_name:fn,last_name:gc('last_name')>-1?(r[gc('last_name')]||'').trim():'',email:gc('email')>-1?(r[gc('email')]||'').trim():'',rsvp_status:RSVP_MAP[rv]||'pending',dietary:gc('dietary')>-1?(r[gc('dietary')]||'').trim():'',notes:gc('notes')>-1?(r[gc('notes')]||'').trim():''};}).filter(Boolean);if(!rows.length){alert('No valid rows to import.');return;}if(!confirm('Import '+rows.length+' guests?'))return;var res=await sb.from('guests').insert(rows);if(res.error){alert('Import failed: '+res.error.message);return;}closeImportModal();var gres=await sb.from('guests').select('*').eq('event_id',eventId).order('created_at',{ascending:true});allGuests=gres.data||[];await sb.from('events').update({guest_count:allGuests.length}).eq('id',eventId);document.getElementById('stat-guests').textContent=allGuests.filter(function(g){return g.rsvp_status==='confirmed';}).length;render();alert('Imported '+rows.length+' guests!');}
init();

</script>
</body>
</html>
