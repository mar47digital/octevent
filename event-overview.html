<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octevent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared.js"></script>
<script src="/header.js"></script>
</head>
<body>
<div id="app-header"></div>
<main>
<div id="ov-content"><div class="spinner"></div></div>
</main>

<script>

async function init() {
  const ev = await OctHeader.init('overview');
  if (!ev) return;

  const [
    {data:guests},{data:checklist},{data:runsheet},{data:budget}
  ] = await Promise.all([
    sb.from('guests').select('id,rsvp_status').eq('event_id',eventId),
    sb.from('checklist_items').select('status').eq('event_id',eventId),
    sb.from('runsheet_items').select('id,date,start_time,finish_time,action,where,done').eq('event_id',eventId).order('date',{ascending:true}).order('start_time',{ascending:true}),
    sb.from('budget_items').select('item_type,actual_amount,paid_amount').eq('event_id',eventId),
  ]);

  const g=guests||[],cl=checklist||[],rs=runsheet||[],bd=budget||[];
  const confirmed=g.filter(x=>x.rsvp_status==='confirmed').length;
  const clDone=cl.filter(x=>x.status==='done').length;
  const clPct=cl.length?Math.round(clDone/cl.length*100):0;
  const exp=bd.filter(x=>x.item_type!=='income');
  const inc=bd.filter(x=>x.item_type==='income');
  const expTotal=exp.reduce((s,x)=>s+parseFloat(x.actual_amount||0),0);
  const expPaid=exp.reduce((s,x)=>s+parseFloat(x.paid_amount||0),0);
  const incTotal=inc.reduce((s,x)=>s+parseFloat(x.actual_amount||0),0);
  const net=incTotal-expTotal;
  const bPct=expTotal?Math.round(expPaid/expTotal*100):0;

  const bar=pct=>`<div style="height:5px;background:var(--rule);border-radius:100px;overflow:hidden;margin-top:8px;"><div style="height:100%;width:${pct}%;background:var(--amber);border-radius:100px;"></div></div>`;
  const card=(label,val,sub,col,pct)=>`<div style="background:#fff;border:1px solid var(--rule);border-radius:12px;padding:1rem 1.25rem;">
    <div style="font-size:0.67rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:0.4rem;">${label}</div>
    <div style="font-family:'Nunito',sans-serif;font-size:1.7rem;font-weight:800;line-height:1;${col?'color:'+col+';':''}">${val}</div>
    ${sub?`<div style="font-size:0.73rem;color:var(--ink3);margin-top:4px;">${sub}</div>`:''}
    ${pct!=null?bar(pct):''}
  </div>`;

  const sched=rs.length?`
    <div style="font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink3);margin-bottom:0.75rem;">Schedule</div>
    <div class="table-wrap table-scroll" style="margin-bottom:1.75rem;"><table>
      <thead><tr><th>Date</th><th>Time</th><th>Activity</th><th>Location</th></tr></thead>
      <tbody>${rs.slice(0,8).map(r=>`<tr>
        <td style="font-size:0.78rem;font-weight:600;white-space:nowrap;color:var(--amber-dark);">${fmtDate(r.date)}</td>
        <td style="font-size:0.78rem;white-space:nowrap;">${fmtTime(r.start_time)}${r.finish_time?' → '+fmtTime(r.finish_time):''}</td>
        <td style="font-size:0.82rem;font-weight:500;">${r.action||'—'}</td>
        <td style="font-size:0.78rem;color:var(--ink3);">${r.where||'—'}</td>
      </tr>`).join('')}</tbody>
    </table>
    ${rs.length>8?`<div style="padding:0.6rem 1rem;font-size:0.78rem;color:var(--ink3);border-top:1px solid var(--rule);">+ ${rs.length-8} more — <a href="#" onclick="OctHeader.go('event-runsheet');return false;" style="color:var(--amber-dark);text-decoration:none;">View full run sheet</a></div>`:''}
    </div>`:'';

  document.getElementById('ov-content').innerHTML=`
    <div style="font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink3);margin-bottom:0.75rem;">Guests</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:1.75rem;">
      ${card('Invited',g.length,g.length?'Total on guest list':'No guests yet')}
      ${card('Confirmed',confirmed,g.length?Math.round(confirmed/g.length*100)+'% of invited':' ',confirmed>0?'var(--green)':'')}
      ${card('Pending response',g.filter(x=>!x.rsvp_status||x.rsvp_status==='pending').length,'Awaiting reply')}
    </div>
    <div style="font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink3);margin-bottom:0.75rem;">Progress</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:1.75rem;">
      ${card('Budget paid',fmtSum(expPaid),expTotal?bPct+'% of '+fmtSum(expTotal):'No expenses yet','',expTotal?bPct:null)}
      ${card('Checklist',clDone+' / '+cl.length,cl.length?clPct+'% complete':'No tasks yet','',cl.length?clPct:null)}
      ${card('Net balance',fmtSum(Math.abs(net)),net>=0?'Surplus':'Outstanding',net>=0?'var(--green)':'var(--red)')}
    </div>
    ${ev.notes?`<div style="font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink3);margin-bottom:0.75rem;">About this event</div>
    <div style="background:#fff;border:1px solid var(--rule);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.75rem;font-size:0.88rem;line-height:1.6;color:var(--ink2);">${ev.notes}</div>`:''}
    ${sched}
    <div style="font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink3);margin-bottom:0.75rem;">Quick actions</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px;">
      <button onclick="OctHeader.go('event-guests')" class="btn" style="justify-content:flex-start;padding:0.75rem 1rem;border-radius:10px;">Add a guest</button>
      <button onclick="OctHeader.go('event-checklist')" class="btn" style="justify-content:flex-start;padding:0.75rem 1rem;border-radius:10px;">View checklist</button>
      <button onclick="OctHeader.go('event-budget')" class="btn" style="justify-content:flex-start;padding:0.75rem 1rem;border-radius:10px;">Log an expense</button>
      <button onclick="OctHeader.go('event-runsheet')" class="btn" style="justify-content:flex-start;padding:0.75rem 1rem;border-radius:10px;">Add run sheet item</button>
      <button onclick="OctHeader.go('event-tableplan')" class="btn" style="justify-content:flex-start;padding:0.75rem 1rem;border-radius:10px;">Table plan</button>
      <button onclick="OctHeader.go('event-rooms')" class="btn" style="justify-content:flex-start;padding:0.75rem 1rem;border-radius:10px;">Manage rooms</button>
    </div>`;
}
init();

</script>
</body>
</html>
