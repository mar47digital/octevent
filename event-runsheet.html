<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octevent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared.js"></script>
<script src="/header.js"></script>
</head>
<body>
<div id="app-header"></div>
<main>
<div class="panel-header">
  <div class="panel-header-left">
    <div class="panel-title">Run sheet</div>
    <button class="btn" id="rs-hide-btn" onclick="toggleHide()">Hide completed</button>
    <button class="btn amber" onclick="addItem()">+ Add item</button>
  </div>
</div>
<div class="progress-wrap" id="rs-progress" style="display:none;">
  <div class="progress-label"><span id="rs-prog-text"></span><span id="rs-prog-pct"></span></div>
  <div class="progress-bar"><div class="progress-fill" id="rs-prog-fill"></div></div>
</div>
<div id="rs-content"><div class="spinner"></div></div>
</main>

<script>

var allItems=[], hideDone=false;

async function init(){
  await OctHeader.init('runsheet');
  var res=await sb.from('runsheet_items').select('*').eq('event_id',eventId).order('date',{ascending:true}).order('start_time',{ascending:true});
  allItems=res.data||[];
  render();
}

function buildRsRow(item){
  var tr=document.createElement('tr');
  tr.dataset.id=item.id;
  if(item.done)tr.style.opacity='0.45';

  function editTd(field,type){
    var td=document.createElement('td');
    if(type==='date'||type==='time'){td.style.fontFamily="'Nunito',sans-serif";td.style.fontWeight='700';td.style.fontSize='0.82rem';}
    td.textContent=type==='date'?fmtDate(item[field]):type==='time'?fmtTime(item[field]):(item[field]||'—');
    if(field==='action')td.style.fontWeight='500';
    if(item.done&&field==='action')td.style.textDecoration='line-through';
    td.style.cursor='pointer';
    td.addEventListener('click',function(){editRsCell(td,item,field,type);});
    return td;
  }

  tr.appendChild(editTd('date','date'));
  tr.appendChild(editTd('start_time','time'));
  tr.appendChild(editTd('finish_time','time'));
  var hrsTd=document.createElement('td');hrsTd.className='num';hrsTd.style.fontSize='0.78rem';hrsTd.style.color='var(--ink3)';hrsTd.textContent=calcHours(item.start_time,item.finish_time);tr.appendChild(hrsTd);
  tr.appendChild(editTd('action','text'));
  tr.appendChild(editTd('who','text'));
  tr.appendChild(editTd('where','text'));
  tr.appendChild(editTd('notes','text'));

  var chkTd=document.createElement('td');chkTd.style.textAlign='center';
  var box=document.createElement('div');
  box.style.cssText='width:18px;height:18px;border-radius:4px;border:2px solid '+(item.done?'var(--amber)':'var(--rule)')+';background:'+(item.done?'var(--amber)':'#fff')+';cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:11px;font-weight:700;';
  if(item.done)box.innerHTML='&#x2713;';
  box.onclick=function(){toggleDone(item.id,item.done);};
  chkTd.appendChild(box);tr.appendChild(chkTd);

  var delTd=document.createElement('td');var btn=document.createElement('button');btn.className='row-del';btn.textContent='Delete';btn.onclick=function(){deleteItem(item.id);};delTd.appendChild(btn);tr.appendChild(delTd);
  return tr;
}

function editRsCell(td,item,field,type){
  if(td.classList.contains('editing'))return;td.classList.add('editing');
  var input=document.createElement('input');input.className='inline-input';
  input.type=type==='date'?'date':type==='time'?'time':'text';input.value=item[field]||'';
  td.innerHTML='';td.appendChild(input);input.focus();
  var saved=false;
  function save(){if(saved)return;saved=true;var val=input.value.trim()||null;item[field]=val;td.classList.remove('editing');render();sb.from('runsheet_items').update({[field]:val}).eq('id',item.id);}
  input.addEventListener('blur',save);
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();input.blur();}
    if(e.key==='Escape'){saved=true;td.classList.remove('editing');td.textContent=type==='date'?fmtDate(item[field]):type==='time'?fmtTime(item[field]):(item[field]||'—');}
    if(e.key==='Tab'){e.preventDefault();save().then(function(){var row=td.closest('tr');var cells=[].slice.call(row.querySelectorAll('td')).filter(function(c){return c.style.cursor==='pointer';});var idx=cells.indexOf(td);var next=e.shiftKey?cells[idx-1]:cells[idx+1];if(next)setTimeout(function(){next.click();},10);});}
  });
}

function render(){
  var total=allItems.length,done=allItems.filter(function(i){return i.done;}).length,pct=total?Math.round(done/total*100):0;
  var prog=document.getElementById('rs-progress');
  if(total){prog.style.display='block';document.getElementById('rs-prog-text').textContent=done+' of '+total+' done';document.getElementById('rs-prog-pct').textContent=pct+'%';document.getElementById('rs-prog-fill').style.width=pct+'%';}
  else prog.style.display='none';
  var hb=document.getElementById('rs-hide-btn');
  hb.textContent=hideDone?'Show all':'Hide completed';hb.style.background=hideDone?'var(--amber-light)':'';hb.style.borderColor=hideDone?'var(--amber)':'';hb.style.color=hideDone?'var(--amber-dark)':'';
  var visible=hideDone?allItems.filter(function(i){return !i.done;}):allItems;
  var el=document.getElementById('rs-content');
  if(!allItems.length){el.innerHTML='<div class="empty-state"><div class="icon">&#x1F4C5;</div><h3>No run sheet items yet</h3><p>Build your timeline item by item.</p><button class="btn amber" onclick="addItem()">+ Add first item</button></div>';return;}
  var wrap=document.createElement('div');wrap.className='table-wrap table-scroll';
  var tbl=document.createElement('table');
  tbl.innerHTML='<thead><tr><th>Date</th><th>Start</th><th>Finish</th><th class="num">Hours</th><th>Action</th><th>Who</th><th>Where</th><th>Notes</th><th style="width:40px;text-align:center;">Done</th><th></th></tr></thead>';
  var tbody=document.createElement('tbody');
  visible.forEach(function(item){tbody.appendChild(buildRsRow(item));});
  var tfoot=document.createElement('tfoot');tfoot.innerHTML='<tr class="add-row"><td colspan="10">+ Add item</td></tr>';tfoot.querySelector('.add-row').addEventListener('click',addItem);
  tbl.appendChild(tbody);tbl.appendChild(tfoot);wrap.appendChild(tbl);el.innerHTML='';el.appendChild(wrap);
}

async function toggleDone(id,current){var nv=!current;var item=allItems.find(function(i){return i.id===id;});if(item)item.done=nv;render();await sb.from('runsheet_items').update({done:nv}).eq('id',id);}
async function addItem(){var res=await sb.from('runsheet_items').insert([{event_id:eventId,date:currentEvent&&currentEvent.event_date||null,start_time:null,finish_time:null,action:'',who:'',where:'',notes:'',done:false}]).select().single();if(!res.error&&res.data){allItems.push(res.data);render();setTimeout(function(){var r=document.querySelector('tr[data-id="'+res.data.id+'"]');if(r){r.scrollIntoView({behavior:'smooth',block:'center'});var c=r.querySelector('td');if(c)c.click();}},80);}}
async function deleteItem(id){if(!confirm('Delete this item?'))return;await sb.from('runsheet_items').delete().eq('id',id);allItems=allItems.filter(function(i){return i.id!==id;});render();}
function toggleHide(){hideDone=!hideDone;render();}
init();

</script>
</body>
</html>
